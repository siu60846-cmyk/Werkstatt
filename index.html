zu tberlegen, auf welche Schwierigkeiten man stoßen könnte.\n30 Es ist abschtieRend wichtig, ...\na recht\nie iy aufzugeben, wenn der Misserfolg so gut wie sicher ist.\n2 a Augenblicken nicht den Mut zu verlieren.\nnicht au Mel Arbeit In das Gelingen unserer Plane zu investieren.\n\nTRANSKRIPT (Werkstatt B2, ohne Lösungen)\nTeil 1\nBeispiel\nA: Dass Semesterferien automatisch viel Freizeit bedeuten, ist ein Mythos. Vor 10-20 Jahren war das vielleicht noch so, aber spätestens seit der Umstellung auf das Bachelor-Master-System ist von den Ferien\nnur noch wenig übriggeblieben.\nB: Die klassischen Semesterferien gibt es nicht mehr, deswegen heißt der Zeitraum am Ende des Semesters auch nicht mehr „Semesterferien“, sondern „vorlesungsfreie Zeit“. Es finden dann zwar keine\nUni-Veranstaltungen mehr statt, aber die Studenten haben trotzdem jede Menge zu tun: Es müssen\nKlausuren geschrieben, Praktika absolviert, Abschlussarbeiten fertiggestellt und wichtige organisatorische Aufgaben übernommen werden.\nHÖRTEXT 1\nA: Seit der Erfindung des Zweirads im Jahre 1817 hat das Fahrrad als Fortbewegungsmittel eine rasante\nEntwicklung hinter sich gebracht. Noch vor wenigen Jahrzehnten galt es als Verkehrsmittel für altmodische Menschen, die sich kein Auto leisten konnten. Mittlerweile gelten Radfahrer als fortschrittlich\nund umweltbewusst, und junge Städter geben mehrere tausend Euro für ihr individualisiertes Fahrrad\naus. In der Stadt ist das Rad Experten zufolge für Distanzen bis zu fünf Kilometern das Verkehrsmittel\nder Wahl, denn es gilt als Antwort auf aktuelle gesellschaftliche Herausforderungen wie Klimawandel,\nStaus, Luftverschmutzung und Lärm.\nHÖRTEXT 2\nA: Ich studiere hier in Leipzig Politikwissenschaft im dritten Semester. Ich würde gerne Journalistin\nwerden, und der Beruf lässt sich auch gut mit meinem Politikinteresse verbinden. Die Vorbereitung an\nmeiner Schule war ausschlaggebend für meine Neigung zur Politik. Durch den Sozialkundeunterricht\nab Klasse 10 habe ich überhaupt erst angefangen, mich für Politik zu interessieren. Später habe ich bei\nder Gestaltung unseres Schulblogs mitgemacht. Durch Praktika und die Unterstützung von Freunden\nhabe ich mich in meinem Berufswunsch bestätigt gefühlt. An der Uni Leipzig gefällt mir, dass ich mein\nStudium selbst gestalten kann.\nHÖRTEXT 3\nA: Wer kennt das nicht: Nach der Arbeit noch schnell einkaufen, für die Familie ein leckeres Abendessen\nzubereiten, dann zum Sport, und seine Freunde wollte man eigentlich auch treffen. Statt es sich auf\nder Couch bequem zu machen, hetzt man von einem Termin zum nächsten.\nB: Ob kulturell oder sportlich, ein Event jagt das andere. Und wer Angst hat, etwas zu verpassen, wird\nfeststellen, dass 24 Stunden am Tag zu wenig sind. Bei der Zeiteinteilung fällt es schwer, alles unter\neinen Hut zu bekommen – Freizeitstress bricht aus.\nHÖRTEXT 4\n- 22 -\n© Praxis\nA: Ein Hotel ohne Internet, geht das?\nB: Für einige ist es absolute Bedingung für eine Hotel-Buchung. Aber eine stetig wachsende Zahl von\nKonsumenten will in den schönsten Tagen des Jahres abschalten und den Stress der Arbeit hinter sich\nlassen.\nA: Der neue Trend heißt also „Offline-Urlaub“. Erste Hotels bieten netzfreie Zonen an, in denen mobile\nGeräte tabu sind. Smartphone, Tablet & Co. müssen an der Rezeption abgegeben werden.\nB: Die Gäste surfen hier nicht im Internet, sondern gehen stattdessen im See fischen, wandern oder\nnehmen an Yoga-Kursen teil.\nHÖRTEXT 5\nA: Beim Kleidereinkauf ist für mich Secondhand die beste Lösung. „Dinge aus zweiter Hand“ sind oftmals\nqualitativ hochwertiger, denn viele sind noch mit ganz viel Handarbeit hergestellt, weil sie lange halten sollten. Für Individualisten eignet sich Second-Hand-Mode besonders, da man keine Massenware\nkauft und somit nicht Gefahr läuft, auszusehen wie alle anderen auf der Straße.\nB: Stimmt! Mode aus zweiter Hand muss außerdem nicht unbedingt billig sein und genauso ausschauen.\nOftmals kann man schöne und seltene Stücke erwerben, die gar nicht mehr hergestellt werden und\neinzigartig sind.\nTeil 2\nModeratorin: Im Studio begrüße ich heute Doktor Elisa Brandes vom Bundesministerium für Bildung. Das\nThema unserer Sendung ist: „Warum machen Frauen in technischen Berufen so selten Karriere?“\nDoktor Brandes, Sie fordern mehr Frauen in MINT-Berufen. Was genau ist denn ein\nMINT-Beruf?\nBrandes:\nMINT steht für Mathematik, Informatik, Naturwissenschaften und Technik.\nEs handelt sich dabei um eine Vielzahl unterschiedlicher Berufe, die jedoch alle Eines\ngemeinsam haben: Für die Ausübung sind überwiegend technische, mathematische oder\nnaturwissenschaftliche Kenntnisse oder Fertigkeiten notwendig.\nModeratorin: Verstehe. Also eher das, was viele noch unter einem typischen Männerberuf verstehen.\nBrandes:\nTja, dieses Klischee hält sich hartnäckig und führt dazu, dass Berufsbilder wie diese kaum\nAnziehungskraft auf junge Frauen haben. Noch immer verbinden sie Technikberufe mit\nkörperlich schwerer, schmutziger Arbeit, die wenig kommunikativ und schon gar nicht kreativ ist. Und sie haben nicht zuletzt Angst, die einzige Frau unter vielen Männern zu sein.\nModeratorin: In Deutschland herrscht ein großer Mangel an Fachkräften aus dem technischen Bereich.\nIst das nicht auch ein Grund, junge Frauen für naturwissenschaftlich-technische Studiengänge zu begeistern?\nBrandes:\nDas Bildungsministerium setzt sich schon seit Jahren dafür ein, das Interesse von Mädchen\nund jungen Frauen für die MINT-Fächer zu erhöhen. Da gibt es beispielsweise Angebote\nwie den Girls’ Day. Am sogenannten Mädchen-Zukunftstag können Schülerinnen ab Klasse\nFünf technische, handwerkliche und naturwissenschaftliche Berufe kennenlernen. Das\nermutigt viele Mädchen und junge Frauen, sich zu trauen und etwas Neues auszuprobieren.\nModeratorin: Wie beeinflusst die Erziehung das spätere berufliche Interesse der jungen Frauen?\nBrandes:\nDie Familie und die Erziehung spielen schon eine wichtige Rolle. Kleine Kinder vergleichen\nsich ja zuerst mit Mama und Papa. Wenn Kinder mit Technik oder Experimenten früh\nErfahrungen sammeln können, steigt auch das Interesse an solch einem Beruf. Aber wenn\nich einem Mädchen einen Werkzeugkoffer schenke, und es sieht nie eine Frau, die einen\nHammer in der Hand hält, dann wird das Mädchen wahrscheinlich auch nicht damit spielen.\nModeratorin: Und wie geht es in der Schule weiter?\nBrandes:\nIm Alter von elf bis 16 Jahren interessieren Mädchen sich am stärksten für Mathematik,\nInformatik, Naturwissenschaft und Technik. Danach nimmt das Interesse für die naturwissenschaftlichen Fächer stark ab. Eine mögliche Erklärung dafür ist, dass sie den Unterricht\nals zu langweilig und zu wenig kreativ empfinden. Auch wünschen sie sich mehr Ermutigung vor allem von Lehrern und weiblichen Vorbildern aus dem Bereich.\nModeratorin: Frauen in Technik und Naturwissenschaft sind also gefragt. Aber was passiert, wenn diese\ndann in den Beruf einsteigen?\nBrandes:\nWir wissen aus Statistiken, dass die Frauen, die tatsächlich in einen naturwissenschaftlich-technischen Beruf gehen, immer noch viel seltener Karriere machen als Männer. Eine\nwesentliche Hürde stellt das Problem dar, Familie und Job unter einen Hut zu bekommen.\nEin Drittel der Frauen hat Schwierigkeiten, einen Kindergartenplatz für den Nachwuchs zu\nbekommen. In diesem Falle müssen sie sich für Teilzeitarbeit entscheiden.\nModeratorin: Und mit Teilzeitarbeit kann man keine Karriere machen.\nBrandes:\nStimmt.\nModeratorin: Frau Doktor Brandes, ich danke Ihnen für dieses interessante Gespräch.\nBrandes:\nGern geschehen.\n© Praxis\n- 23 -\nTeil 3\nModerator:\nSchwarz:\nModerator:\nSteiner:\nModerator:\nSchwarz:\nModerator:\nSchwarz:\nModerator:\nSteiner:\nModerator:\nSteiner:\nModerator:\nSchwarz:\n- 24 -\n© Praxis\nModerator:\nHerzlich willkommen, liebe Zuhörerinnen und Zuhörer, zu unserer „Frage der Woche“,\nheute: Fremdsprachen lernen. Bringt es nur jungen Menschen Vorteile, oder können auch\nältere Menschen davon profitieren? Mein erster Gast im Studio ist Frau Claudia Schwarz.\nSie ist 22 Jahre alt, spricht zwei Fremdsprachen und lernt gerade an der Uni Heidelberg\nihre dritte, nämlich Chinesisch.\nHallo. Ja, ich studiere im dritten Semester Sinologie, also Chinakunde.\nBevor Sie uns erzählen, weshalb Sie sich gerade für Chinesisch entschieden haben, wollen\nwir unseren zweiten Gast begrüßen. Herr Franz Steiner ist pensionierter Ingenieur und\nlernt an der Volkshochschule Spanisch.\nGuten Tag.\nFrau Schwarz, was hat Sie denn dazu bewogen, Sinologie zu studieren?\nAlso, eigentlich wollte ich schon immer Chinesisch lernen und dachte mir, dass es auf\njeden Fall sehr gut ist, etwas über einen anderen Kulturraum zu erfahren und über ein so\nriesiges Land, das ja auch in der Wirtschaft und in der Politik immer wichtiger wird. An unserer Schule hatten wir eine Chinesisch-AG, da konnte ich schon erste Einblicke gewinnen.\nDa hatten Sie aber Glück! An meiner Schule mühte ich mich noch mit Latein ab, von ausgefallenen Sprachen wie Chinesisch träumte man damals nur.\nNa ja, klassische Sprachen wie Latein sind auch nicht unwichtig für ein Studium, aber\nauf dem weltweiten Arbeitsmarkt erhoffe ich mir größere Chancen mit meinen Chinesisch-Kenntnissen.\nUnd ich denke, Ihre Chancen stehen nicht schlecht. Aus Sicht von großen internationalen\nKonzernen ist Mandarin, Chinas offizieller und am weitesten verbreiteter Dialekt, mittlerweile die zweitwichtigste Fremdsprache überhaupt. Aber nicht nur für die Karriere sind\nFremdsprachen förderlich, die Sprache der Einheimischen zu sprechen macht die Kommunikation viel persönlicher. Herr Steiner, Sie haben nach Ihrer Pensionierung mit Spanisch\nbegonnen.\nJa, meine Frau und ich haben vor zwei Jahren ein Ferienhaus in Spanien gekauft, und ich\nmöchte mich mit meinen neuen Nachbarn in ihrer Muttersprache unterhalten können.\nJetzt habe ich auch endlich die Muße dazu, denn solange ich gearbeitet habe, hat es mir\nimmer an Zeit und Ruhe gemangelt.\nDa haben Sie sich gemäß neuesten Forschungen die richtige Zeit ausgewählt. Denn das\nLernen einer Fremdsprache im Alter gilt als ausgezeichnetes Gehirntraining. Eignet man\nsich eine zweite Sprache nämlich erst als Erwachsener an, kann der Abbau kognitiver\nFähigkeiten gebremst werden.\nNun ja, anfangs hatte ich Bedenken wegen meines fortgeschrittenen Alters, denn ich war\nder älteste in meinem Kurs. Aber mittlerweile bin ich begeistert, auch deshalb, weil die\nKursleiterin darauf Rücksicht nimmt, dass ich zum Beispiel mehr Zeit brauche, um Wortschatz zu lernen oder dass ich mehr Erklärungen zur Grammatik benötige als die übrigen\nKursteilnehmer.\nDarüber hinaus verfügen Sie über einen ganz besonderen Vorteil, nämlich Ihre Lebensund Lernerfahrung. Außerdem bringen Ihre Altersgenossen Experten zufolge die größte\nWillenskraft mit, denn sie lernen aus eigener Motivation. Zum Schluss eine Frage an Sie\nbeide: Frühes Sprachenlernen: ja oder nein?\nAlso, ich habe gelesen, dass man von klein auf mehrere Sprachen erlernen kann, dass\nder Mensch also mehrsprachig veranlagt ist. Ich sehe das an meiner Nichte, die in\neinen zweisprachigen Kindergarten geht und dort Englisch lernt. Sie macht Tag für Tag\nenorme Fortschritte und lernt dabei spielend. Es wäre schade, dieses Potenzial nicht auszuschöpfen.\nDanke Ihnen beiden für den interessanten Einblick. Was denken Sie, liebe Zuhörerinnen\nund Zuhörer, zu unserem Thema? Rufen Sie uns an! Unsere Telefonnummer ist (ausblenden).\nTeil 4\nSehr geehrte Damen und Herren, herzlich willkommen zu meinem Vortrag „Gute Vorsätze fassen und\numsetzen – eine Sache mit zwei Gesichtern“. Ich bin Renate Drews von der Uni Göttingen.\nGeht es Ihnen auch so? Silvester naht, und für das neue Jahr nehmen sich viele Menschen Veränderungen\nvor. Der Sportmuffel denkt sich, er müsse endlich mehr laufen; der Raucher nimmt sich fest vor, endlich\naufzuhören. Manch einer versucht, mit einer langen Liste an Vorsätzen sein ganzes Leben auf einmal zu\nändern.\nViele Vorsätze, die für das kommende Jahr gefasst werden, wiederholen sich Jahr für Jahr. Sie klingen oft\nso einfach, lassen sich aber doch nur schwer einlösen. Schuld daran sind oft übertriebene und unklare\nErwartungen, die wir an uns selbst stellen.\nWir wissen heute: Je undeutlicher unsere Vorsätze, desto unwahrscheinlicher ist deren Gelingen. Wer also\nein paar Kilo abnehmen möchte, sollte sich nicht allgemein vornehmen, im neuen Jahr ins Fitnessstudio zu\ngehen. Stattdessen sollte das Ziel lauten: Jede Woche gehe ich mindestens einmal zum Radfahren in der\nHalle und einmal zum Pilates-Kurs.\nDazu folgender Rat: Am besten trägt man sich die Termine in einen Kalender oder eine Liste ein. So hat\nman nicht nur Kontrolle darüber, ob man seine Vorsätze wirklich einhält, auch das Nicht-Einhalten fällt\neinem schwerer, weil man seine Ziele Schwarz auf Weiß hat. Das schlechte Gewissen kann also durchaus\nauch etwas Positives bewirken.\nWas auch wichtig ist: Wählen Sie positive Formulierungen, wenn Sie Ihre Vorsätze fassen! Lassen Sie\nmich ein Beispiel nennen: „Ab übermorgen werde ich schweren Herzens auf Pizza und Pasta verzichten“.\nNa, wie klingt das? Genau: wenig motivierend! Deshalb sollten die Vorsätze bewusst positiv formuliert\nsein, wie z.B. „Ab übermorgen werde ich völlig neue Rezepte ausprobieren und lauter frische, leckere\nSpeisen zubereiten“. So freut man sich darauf, seine Pläne in die Tat umzusetzen.\nGroße Wünsche lassen sich übrigens am besten realistisch und in kleinen Schritten angehen. Wer endlich\njoggen gehen möchte, wird im Februar nicht gleich einen Marathon bestreiten können. Es muss auch\nnicht gleich eine Stunde am Tag sein: zweimal in der Woche je 20 Minuten sind für den Einstieg völlig okay.\nSo fällt es leichter, mit den guten Vorsätzen wirklich zu starten.\nNicht zuletzt sollte man sich fragen: Welchen Nutzen verspreche ich mir von dem Vorsatz? Ein besseres\nKörpergefühl? Weniger Alltagsstress? Ebenso wie die Vorsätze selbst, sollten auch die Ziele schriftlich festgehalten werden. Am besten auf einem oder mehreren Zetteln, die man entweder in der Wohnung verteilt\noder als „Post-it“ an den Monitor klebt.\nEmpfinden Sie das als zu viel oder gar sinnlose Arbeit? Nun, diese Annahme ist falsch! Denn in Momenten,\nwo man am liebsten aufgeben möchte, kann man sich - im wahrsten Sinne des Wortes - vor Augen führen,\nwofür man das Ganze eigentlich macht. Wenn uns der Mut verlässt, kann uns ein kurzer Blick wieder auf\nden richtigen Weg bringen.\nMeine Damen und Herren, ich wünsche Ihnen einen guten Rutsch ins neue Jahr und bedanke mich recht\nherzlich für Ihre Aufmerksamkeit.\n© Praxis\n- 25 -","S":"SCHREIBEN (Lehrbuch, OCR)\nCHREIBEN\n75 min E\nyeild\nA auteabe\nsie schreiben einen Forumsbeitrag fur Persons\nen, die sich um ei\nvorschüge brauchen m eine neue Arbeitsst\ntelle bewerben wollö\nlen und\n+ Merkmale einer guten Bewerbung\n«Tipps fir ein gelungenes Vorsteltu\nmgsgespra i\n\"ous Kallegen und Kolleginnen lanes :\n2 pas Verhalten am ersten Arbeitstag\nsenken Sie an eine Einleitung und einen\nSchluss, Bei d\nInnaltspunkte bearbeitet sit x ler Bewertung wi\nelspa bea ite sind, wie korrekt der Text ist und wie Wt orn eactnes wie gence\nimteinander verknipft sind, Schreiben Sie mindestens 150 Wart gut ie Sze und Abschnitespachieh 3\ni ec\nTeil2\nN sutgabe :\nDas Universitaitsktit :\nit i :\n‘itsklinikum in Ihrer Stadt plant einen Tag der offenen Tur. Sie wollen Burgerinnen und Birger A\nten in der Klinik ols Arzt/Aratin und haben daza :\nfir das Th\neinige ‘desi Organspende sensibilisieren, denn Sie arbeit\n. Darum schreiben Sie eine E-Mail an thren Chef, Herrn Seidel.\nSagen Sie, warum Sie\nErzthlen Sie von Ihrer\nHerm Seidel schreiben\nArbeit\neit am Universitdts—\n4 und nicht jemand anderers :\nKind,\nOS ae 1a\noff Machen Sie 24% fies A :\ntig * ger sensivilisior ans e :\nBarge : d\nte. get der Bewertung wird darauf\ner Text ist und wie gue die satze und\nwörter. 2\ndie Inhaltspu für ein Muss.\nb Auszubildender\nAuszubildende :\nX Aufgaben\nif manche Lehrberufe ist das Abitur eine Mindestvoraussetzung. . q\na Moderatorin b Auszubildender Auszubildende\nb Auszubildender Auszubildende ' >\nAuszubildende.\nc: Teil 4\n: . ie@ horen den Text zweimal, Wahlen Sie be\nSS! siehorencinensurzen vortrag. Sie OPE deO AS feoben\nEL tounge, bader 23 bis 30. Dazu haben Sie 90 Sekunden Zeit. ™\n5 Lesen Sie jetst die Aufgaben\nX Aufgaber\n24 Senioren, die Campingurlaub machen, ..\n‘a sind nicht aiter als 65.\nb sollten sich regelmagig 4rztlich untersuchen lassen.\ngeben sich nicht mit einer elementaren Ausrüstung zufrieden.\n3 machen in der Regel eine genaue Urlaubsplanung.\n3 b> planen ihren Urlaub Shnlich wie die jungen Leute.\n. < tighen am liebsten mit Rucksack und Zelt in die Natur.\n28 Was ist fir Senioren, die in der Natur Urlaub machen, wichtig?\n“ a Bequemer Transport zum und vom Urlaubsort zurück.\n: 5 Sachen, wo man gemütlich sitzen oder liegen kann.\nDie Gesellschaft von Leuten mit den gleichen Hobbys.\n\nTRANSKRIPT (Werkstatt B2, ohne Lösungen)\nTeil 1\nBeispiel\nA: Kann eine Rakete mit Wasserantrieb fliegen? Sie kann! Das beweisen jedes Jahr die Teilnehmerinnen\nund Teilnehmer bei einem Wettbewerb der Universität Duisburg für Schüler. Es geht darum, auf\nkreative Art physikalische Aufgaben zu lösen. Prämiert wird die physikalische Idee. Originell und\nrobust soll das Modell auch sein – und natürlich funktionieren! Schönheit spielt keine Rolle.\nB: Dieses Jahr kämpfen fast 2 000 Schüler aus Nordrhein-Westfalen um den Sieg in mehreren Klassen.\nAufgaben sind zum Beispiel der Bau eines Heißluftballons oder einer Papierbrücke. Die Gewinner\nerhalten wertvolle Gutscheine für Bücher und andere Medien.\nHÖRTEXT 1\nA: Endlich einmal gute Nachrichten für Bremen und Hamburg! Die beiden norddeutschen Bundesländer\nerhalten bei Schulleistungsvergleichen im Normalfall ja nicht gerade Bestnoten. Nun aber zeigt eine\nStudie: Wenn es um digitale Bildung geht, wird der Norden zum Vorbild. Dort sitzen Lehrer, die keine\nAngst vor Computern und digitalen Lernmaterialien haben, sondern die Geräte, auch die ihrer Schüler,\nclever in den Unterricht integrieren.\nB: Jedoch sind nicht alle Lehrer fit für den Einsatz digitaler Medien. Schüler sind der Meinung: “Bei den\nLehrern, die sich damit auskennen, bringt es etwas, bei den anderen ist es Zeitverschwendung!”\nHÖRTEXT 2\nA: Deutsche Popmusik ist in Deutschland so beliebt und erfolgreich wie noch nie. Auch in den Charts\nstehen deutsche Produktionen regelmäßig ganz oben. Viele Jahre galt Englisch als die Sprache des\nPop, und die meisten Bands aus Deutschland befolgten dieses ungeschriebene Gesetz. Heute ist\nes normal, auf Deutsch zu singen. Die Bands versuchen nicht mehr, den angloamerikanischen Pop\nzu imitieren. Sie musizieren ganz selbstverständlich in ihrer eigenen Sprache. Neue und etablierte\nKünstlerinnen und Künstler inspirieren sich gegenseitig und sorgen damit für eine enorme Vielfalt im\ndeutschen Pop.\nHÖRTEXT 3\nA: Warum machst du Yoga?\nB: Yoga hilft mir, mit den täglichen Höhen und Tiefen besser zurechtzukommen und einen klaren Kopf\nzu behalten, damit ich mich vor Prüfungen auf den Punkt konzentrieren kann. Es hilft mir, cooler zu\nwerden, mit Stress besser umzugehen und meinen Körper fit und schön zu machen. Im Teamsport\noder bei Wettbewerbssportarten kommt es immer darauf an, besser oder fähiger als die anderen\nzu sein. Aber mit Yoga brauche ich keine Angst zu haben, nicht gut genug zu sein oder hinter den\nanderen zurückzustehen.\nHÖRTEXT 4\n- 26 -\n© Praxis\nA: Endlich Urlaub! Abschalten, Spaß haben, entspannen. Dazu gehört für viele Alkohol, oft hochprozentig. Reiseveranstalter locken mit All-inclusive-Angeboten, Lokale mit Flatrate-Partys. Schon nach\ndem Frühstück gibt es an der Hotelbar alkoholische Getränke gratis, am Strand sorgen Cocktails für\nUrlaubsstimmung und abends geht die Party richtig los.\nB: So werden aber die Ferien, die als Erholung gedacht waren, zur Belastungsprobe für den Körper,\ndenn bei Hitze wirkt Alkohol schneller und intensiver, weil der Körper ihn schlechter verarbeiten\nkann. Das kann zu Kreislaufproblemen bis hin zum Kollaps und zu Bewusstlosigkeit führen.\nHÖRTEXT 5\nA: Über die Aussage „Früher war alles besser“ lässt sich bekanntlich streiten. Trotzdem, in manchen\nFällen stimmt diese Aussage sogar.\nB: Viele Dinge, die in der Vergangenheit gratis waren, kosten heute nämlich Geld. Früher war Parken in\nder Stadt nicht immer kostenpflichtig. Heute muss man in vielen Großstädten mehrere hundert Euro\npro Jahr für einen Stellplatz bezahlen. Auch müssen wir mittlerweile für Plastiktüten bezahlen. Bis vor\neinigen Jahren gab es die fast überall umsonst. Viele Händler verlangen nun bis zu 50 Cent pro Tüte.\nA: Das ist aber nicht unbedingt eine schlechte Änderung, schließlich schonen wir so die Umwelt.\nTeil 2\nModerator:\nAeppli:\nModerator:\nAeppli:\nModerator:\nAeppli:\nModerator:\nAeppli:\nModerator:\nAeppli:\nModerator:\nAeppli:\nModerator:\nAeppli:\nIm Studio begrüße ich heute Herrn Professor Urs Aeppli von der Interkantonalen Hochschule für Heilpädagogik in Zürich. Professor Aeppli, Sie machen sich seit Jahren stark für\ndie frühe Förderung von Kleinkindern in sozial schwachen Familien.\nVerstehen Sie mich nicht falsch: Jedes Kind muss angeregt und gefördert werden. Doch\n80 bis 90 Prozent der Kinder erhalten dies automatisch: Die Familie hat viele Kontakte,\ngeht aus, lädt Verwandte und Freunde ein und so weiter. Die Kinder bewegen sich\nim und vor dem Haus. Sie setzen sich aktiv mit ihrer Umgebung auseinander. Kinder, die\nso aufwachsen, kriegen genug Anregung. Ich mache mich deshalb für die restlichen 10 bis\n20 Prozent stark.\nWelche Probleme haben Kinder solcher Familien?\nEinige dieser Kinder sind schon nach 18 Monaten in ihrer Sprachentwicklung und in ihrer\nBeweglichkeit zurück, denn sie kommen nicht aus dem Haus und in Kontakt mit der Umwelt. Ihre Eltern sind oft liebevoll und unterstützend, aber vielleicht sind sie arbeitslos,\nhaben kaum Geld und leben isoliert in einer kleinen Wohnung. Das betrifft nicht nur\nausländische Familien, sondern auch viele Schweizer.\nWas kann man dagegen tun?\nIm Rahmen unseres Projekts besuchen speziell ausgebildete Eltern-Trainerinnen die\nbetroffenen Familien zu Hause und geben den Eltern hilfreiche Tipps und Materialien, mit\ndenen sie täglich 15 Minuten mit ihren Kindern Übungen und Spiele zur Sprachförderung\nmachen. Außerdem werden teilweise mehrwöchige Kurse für bildungsferne Familien angeboten.\nUnd das reicht schon?\nBis jetzt sind die Ergebnisse positiv. Im Vergleich zu anderen Familien, die nicht gefördert\nwerden, verfügen die Kinder über einen höheren Wortschatz und sind kontaktfreudiger.\nDie unterstützten Eltern achten mehr darauf, was für ihr Kind gut ist. Sie nutzen öfter\ndie Angebote sozialer Einrichtungen wie Kindertagesstätten oder Tagesschulen. Auch\nläuft der Fernseher nicht mehr den ganzen Tag, und die Mütter besuchen häufiger einen\nDeutschkurs.\nDas klingt vielversprechend, aber auch kostenaufwändig in einer Zeit, wo überall im Land\nSparmaßnahmen durchgesetzt werden.\nGerade deshalb müssen wir in frühe Förderung investieren. Langfristig lohnt sich das\nfür den Staat finanziell, denn je früher die Förderung ansetzt, desto stärker sind Effekte\nim weiteren Lebensverlauf. Oft wird erst dann gefördert, wenn aus Kindern Jugendliche\ngeworden sind, etwa in Form von sonderpädagogischen Maßnahmen, die teuer sind und\nnicht immer die erhoffte Wirkung zeigen.\nGibt es Länder, die in diesem Bereich vorbildlicher sind?\nJa. Doch gute Beispiele gibt es bereits im eigenen Land: Im Kanton Tessin gehen 60 Prozent der Kinder mit drei bereits in den Kindergarten. Mit vier Jahren sind es schon fast\nalle. Vor allem Migranten schicken ihre Kinder früh, damit diese für die Schule vorbereitet\nsind. Alle Kinder gehen mit sechs in die Schule und fast alle reden Italienisch. Das ist toll.\nProfessor Aeppli, ich danke Ihnen für dieses Gespräch und wünsche Ihrem Projekt weiterhin viel Erfolg.\nIch danke Ihnen!\n© Praxis\n- 27 -\nTeil 3\n- 28 -\n© Praxis\nModeratorin: Hallo, liebe Zuhörerinnen und Zuhörer, bei unserem Radiomagazin „Bildung aktuell“.\nHeute mit der Frage: Nach dem Abitur folgt die Uni, dieses Motto ist weit verbreitet. Eine\nschlichte Berufsausbildung ist aus Sicht der Abiturienten offenbar keine Alternative – oder\netwa doch? Mein erster Gast im Studio ist Martin Steiner. Nach dem Abitur entschied er\nsich gegen ein Studium und für eine Berufsausbildung.\nSteiner:\nJa, hallo. Ich mache eine Ausbildung zum Fluglotsen, das heißt, ich werde später den\nFlugverkehr kontrollieren.\nModeratorin: Da gehören Sie zu einer kleinen Gruppe von Auserwählten, der Beruf des Fluglotsen ist,\nglaube ich, sehr gefragt.\nSteiner:\nStimmt, deshalb nimmt man auch keine Bewerber, die nicht über ein Abitur verfügen.\nUnd natürlich muss man unter anderem auch sehr gut Englisch können.\nModeratorin: Unser zweiter Gast im Studio ist Frau Petra Wagner. Sie hat ihr Jurastudium nach dem\ndritten Semester abgebrochen und macht nun eine Ausbildung bei einer Firma, die Filme\nproduziert.\nWagner:\nJa, hallo.\nModeratorin: Frau Wagner, warum haben Sie sich nicht von Anfang an für eine Ausbildung entschieden?\nWagner:\nAlso, ich wollte schon immer beim Film arbeiten. Aber als es nach dem Abitur darum ging,\nmich für ein Studium oder eine Ausbildung zu entscheiden, wurde ich unsicher. Meine\nEltern rieten mir dazu, lieber etwas „Vernünftiges“ wie Jura zu studieren.\nModeratorin: Dabei stellt sich oft heraus, dass das Studium nicht für jeden die richtige Wahl ist - immerhin brechen jedes Jahr 70.000 Studenten ab.\nWagner:\nBei mir war das so, dass ich keine echte Verbindung zu meinem Studium aufbauen konnte,\nkeine Motivation verspürte, und irgendwann habe ich eingesehen, dass man mit seiner\nBeschäftigung nur erfolgreich sein kann, wenn man auch mit dem Herzen dabei ist. Und\ndas ist für mich der Film.\nSteiner:\nIch denke auch, wer sich schon in der Schule mit dem ewigen Lernen gequält hat, dem\nwird es an der Uni nicht besser gehen. Außerdem hat man mit einer Ausbildung schon\nmal einen ersten Abschluss in der Tasche und kann sein erstes Geld verdienen. Und falls\nman sich entschließen sollte, doch noch zu studieren, hat man nichts verloren, außer vielleicht ein bisschen Zeit.\nModeratorin: Die Ausgaben für Semesterbeiträge, Studiengebühren und den eigenen Lebensunterhalt\nsind laut Umfragen ein Grund, weshalb viele Studierende das Studium vorzeitig abbrechen. Was meinen Sie?\nWagner:\nIch glaube, das Finanzielle spielt schon eine große Rolle. Während andere sich noch durch\ndie Semester plagen, haben Auszubildende schon ihr Gehalt in der Tasche und stehen auf\neigenen Beinen. Und während ihrer Ausbildung erkennen viele, dass ihnen ein praktischer\nBeruf viel mehr gibt und dass ihre Fähigkeiten besser anerkannt werden.\nModeratorin: Das belegen auch Statistiken. Immerhin hat es jede dritte Führungskraft in Deutschland\nohne Studium nach oben geschafft. In manchen Branchen, wie dem Handel, gibt es mehr\nChefs ohne Studium als mit. Dazu tragen auch Fortbildungen bei, mit denen man weitere Qualifikationen erwirbt. Eine abschließende Frage an beide: Studium oder Lehre?\nWelchen Ratschlag möchten Sie unseren Zuhörern geben?\nSteiner:\nIch denke, letztendlich hängt die Entscheidung von den eigenen Wünschen und Interessen ab. Also, was will ich in meinem Leben erreichen, wie viel Energie investiere ich in\nmeine Ziele und so. Aber am wichtigsten finde ich, dass heutzutage weder ein Studium\nnoch eine Ausbildung ohne Alternativen sind: Wer nach der Ausbildung Lust auf mehr hat,\nkann immer noch ein Studium beginnen.\nModeratorin: Frau Wagner, Herr Steiner, ich wünsche Ihnen alles Gute für die weitere Ausbildung und\nbedanke mich recht herzlich für dieses interessante Gespräch.\nWagner:\nGerne.\nSteiner:\nGern geschehen.\nTeil 4\nHerzlich willkommen, meine sehr verehrten Damen und Herren, zu meinem Vortrag „Campingurlaub ab\n65: Was ist zu beachten?“ Ich bin Mario Westermann vom Senioren-Verband Nordrhein-Westfalen.\nSich im Urlaub an der frischen Luft zu bewegen, ist kein Privileg der Jugend. Im Gegenteil, je älter er wird,\numso mehr weiß der Mensch in der Regel die Natur und ihre ständigen Veränderungen zu schätzen. Dieses\nPhänomen erklärt auch die anhaltend große Begeisterung für Campingurlaub.\nAuf den Campingplätzen findet man daher immer auch eine große Zahl von Freiluftfans jenseits der magischen 65. Verständlich, dass es mit dem Einfach-Zelt für 20 Euro und einer Isomatte nicht mehr getan ist,\nwenn man schon älter ist. Worauf sollte man beim Urlaub für Senioren also achten?\nNun ist der Mensch bekanntlich ein Gewohnheitstier und gerade im fortgeschrittenen Alter hat er so seine\nlieben Gewohnheiten, die er nur ungern, auch nur für kurze Zeit, ablegen würde. Viele brauchen ihre lieb\ngewonnenen Dinge wie eine bestimmte Decke oder eine bestimmte Tasse immer in ihrer Nähe.\nAußerdem ist es für Senioren in der Regel mehr stressig als reizvoll, einfach so loszufahren und darauf zu\nvertrauen, dass alles klappt. Daher planen Senioren ihren Camping- oder Freilufturlaub oft genauer als\njüngere Leute, die mit Rucksack und Zelt auf große Tour gehen.\nLangfristiges Planen kann auch bedeuten, Jahr für Jahr einen bestimmten Campingplatz aufzusuchen und\nsich schon lange vor dem Urlaub den Platz an der Sonne zu sichern. Wenn die Lage und die anderen Gäste\nstimmen, spricht doch nichts dagegen, oder?\nAuch ein wichtiger Punkt: Ein bisschen Komfort tut immer gut. Sich auf eine unbequeme Luftmatratze zu\nlegen, gehört nicht zu den Freuden der Camper jenseits der 65. Dagegen kann eine sich selbst aufblasende\nMatratze mit einem Samtüberzug genau passend sein, um sich auch fern der Heimat wohl und behaglich\nzu fühlen. Auch der schnell aufzuklappende Liegestuhl spielt hier eine große Rolle. Ob man ihn zum Lesen\ntagsüber nutzt oder abends in einer Runde Karten spielt: Der Stuhl muss weich gepolstert sein und sich\nauch leicht wieder zusammenklappen lassen.\nAber was tun, wenn man merkt, dass so manches Insekt oder die nächtliche Kühle den Spaß am Camping\ngründlich vermiesen? Dagegen sind ältere Leute in der Regel empfindlich. Wer es etwas bequemer mag,\nwählt statt des luftigen Zeltes ein Wohnmobil. Dabei muss es nicht immer ein kostspieliger Neuwagen\nsein. Die Anschaffung eines gebrauchten Wohnmobils ist oft sehr leicht zu realisieren. Wohnmobile muss\nman nicht erst umständlich aufbauen, wie das beim Zelt der Fall ist.\nMit einem Wohnmobil kann man übrigens in vielen Ländern auch fern von etablierten Campingplätzen\nRast machen, auch außerhalb Deutschlands, Österreichs und der Schweiz. Es kommt nicht von ungefähr,\ndass Senioren zunehmend Fremdsprachenkurse an Volkshochschulen besuchen. Auch mit elementaren\nSprachkenntnissen öffnet sich die Welt für Senioren auf eine ganz angenehme Weise.\nMan kann also auch jenseits der 65 seinen persönlichen Weg finden, der Natur nah zu sein und sich\ndennoch wie zu Hause zu fühlen. Verehrte Damen und Herren, ich danke Ihnen herzlich für Ihre Aufmerksamkeit.\n© Praxis\n- 29 -","S":"SCHREIBEN (Lehrbuch, OCR)\nvsseses WERKSTATT Bo\n\\ auteabe\ninen Forumsbeitrag zu! \" a\nThema: Sollen Jugendliche un /ahlen dürfer\nlen Jug he unter 18 Jahren wah\nses\nAugern Sie thre persönliche Einstellung.\nNennen Sie Grinde, die dafür oder dagegen sprech :\n.n Sie moglich t i echen. :\nae Sie Hea ene Folgen einer Änderung des Mi :\n, sich als Jugendlicher unter 18 politi ncestwanlalers 5\nisch zu engagieren.\npenten Sie an eine Einleitung und einen Schlus: i\n's. Bei der B\njebaitspunkte bearbeitet sind, wie fee na\nder verknüpft sind. wie korrekt der Text ist und wie die Ese Genta ae eh\nnder verknipft sind. Schreiben Sie mindestens 150 Wart. uh ale sotes!cnd:Abschalte'sprochl ‘\ner ‘achlic!\nTez\n\\ pupabe\nd umziehen und haben nun ein sehr\nMail an ändern: Über 80 Prozent der Bürger\nkönnen sich nicht vorstellen, auf Bargeld völlig zu verzichten.\nHÖRTEXT 1\nA: In den kommenden zehn Jahren will das Bundesbildungsministerium mit speziellen Lernangeboten\nund anderen Projekten die Lese- und Schreibkompetenz von Erwachsenen steigern. In Deutschland\nleben nämlich mehr als 7,5 Millionen funktionale Analphabeten: Menschen, die nicht richtig lesen\nund schreiben können, obwohl sie zur Schule gegangen sind. Rund 60 Prozent von ihnen gehen ganz\nnormal arbeiten und verstecken im Alltag ihren Analphabetismus. Ihre Einkäufe erledigen sie beispielsweise, indem sie sich in der Fernsehwerbung Bilder von Produkten einprägen – denn lesen,\nwas auf der Verpackung steht, können sie nicht.\nHÖRTEXT 2\nA: „Superfood“ ist lediglich ein Marketingwort, eine wissenschaftlich anerkannte Definition gibt es nicht.\nGemeint sind Lebensmittel, die aufgrund ihrer Nährstoffe als besonders gesund gelten – allen voran\nObst- und Gemüsesorten, die viele Vitamine und Nährstoffe enthalten.\nB: Viele Superfoods kommen jedoch von weit her und sind meist sehr teuer. Sie werden selten frisch,\nsondern meist getrocknet angeboten. Da ist es besser, auf heimische Alternativen zurückzugreifen.\nÜber heimische Lebensmittel bekommen wir den gleichen Nutzen, den wir uns von exotischen\nFrüchten erwarten. Um gesund zu essen, braucht man also kein teures Superfood.\nHÖRTEXT 3\nA: Was macht eine echte Freundschaft aus? Die wirklich wahren Freunde sind diejenigen, die du an einer\nHand abzählen kannst, auf die du dich immer verlassen kannst. Wenn es dir wirklich schlecht geht,\nsind sie da und erfinden keine Ausrede, warum sie dich gerade nicht unterstützen können.\nB: Klar, dass wir von dieser Art Freunden nicht so viele haben, denn es gibt nur wenig Menschen,\ndie perfekt zueinander passen. Diese Beziehungen entstehen nicht von heute auf morgen, sondern\nbrauchen Zeit, um sich zu entfalten. Dafür kann wahre Freundschaft ewig halten.\nHÖRTEXT 4\n- 30 -\n© Praxis\nA: Ein kühles Bier, ein leckeres Picknick und sommerliche Stimmung im Schatten unter Bäumen: Das ist\nder typische bayerische Biergarten. Kein Ort für Feinschmecker und nicht für Leute, die Luxus schätzen. 2012 wurde er 200 Jahre alt, ist beliebt wie am Anfang und längst über die Grenzen Bayerns und\nDeutschlands hinausgekommen. Aber auch wenn es inzwischen in ganz Deutschland Biergärten gibt,\nbleiben sie doch das Markenzeichen für bayerischen Lebensstil. An warmen Sommerabenden packen\ndie Süddeutschen einen Picknickkorb und treffen sich im Biergarten. Hier trinken sie ein Bier frisch\nvom Fass, essen eine Kleinigkeit und verbringen gemeinsam den Feierabend.\nHÖRTEXT 5\nA: Es gibt Situationen im Leben, die haben auf den ersten Blick gar nichts Positives an sich: der Verlust\ndes Arbeitsplatzes, eine schwere Erkrankung oder eine Trennung. Das kann zwar jedem passieren,\naber viele fallen daraufhin in ein tiefes seelisches Loch und sind zutiefst frustriert. Andere wiederum\nfühlen sich erst recht ermutigt, das Schicksal selbst anzupacken und machen aus der Not eine Tugend.\nB: So hat man zum Beispiel nach einer Kündigung die Gelegenheit, sich nach einer besseren Stelle\numzusehen. Rückschläge können demnach mitunter motivierend wirken. Denn in Notsituationen sind\nbereits zahlreiche gute Ideen entstanden.\nTeil 2\nModeratorin: Im Studio begrüße ich heute Frau Doktor Marion Heinecke, Neurowissenschaftlerin\nan der Universität Freiburg. Sie sagt: „Multitasking ist ein Mythos“ und ihre Devise beim\nArbeiten lautet: „Immer schön der Reihe nach.“ Fangen wir mal beim Begriff an: Was\ngenau ist „Multitasking“?\nHeinecke:\nDer Begriff „Multitasking“ kommt eigentlich aus dem Computer-Bereich und beschreibt\ndie Fähigkeit eines Betriebssystems, mehrere Aufgaben praktisch gleichzeitig auszuführen. Bei uns Menschen ist es so, dass wir in begrenztem Maße fähig sind, mehrere Aufgaben gleichzeitig zu erledigen, jedoch ist es nur bei Routineaufgaben wie Turnübungen,\nKochen, Duschen oder Lesen möglich, dabei gleichzeitig an etwas anderes zu denken.\nModeratorin: Wie steht es mit komplexeren Aufgaben?\nHeinecke:\nEs gibt gewisse Prozesse, die das Gehirn nicht gleichzeitig ausführen kann. So braucht eine\nEntscheidung eine Art zentrale Aufmerksamkeit, und diese ist unteilbar. Wenn ich beispielsweise am Telefon gefragt werde, welcher Termin mir besser passt, und gleichzeitig\nmeine Sekretärin per E-Mail fragt, ob sie bestimmte Unterlagen ausdrucken soll, können\ndie beiden Entscheidungsprozesse nur nacheinander ablaufen.\nModeratorin: Dazu gehört wohl auch das Telefonieren während der Autofahrt.\nHeinecke:\nGenau. Eine Analyse ergab, dass in den USA knapp ein Drittel aller tödlichen Autounfälle\nauf Telefonieren am Steuer zurückzuführen sind. Studien zufolge sinkt nämlich die Leistungsfähigkeit der Autofahrer um mindestens 40 Prozent, wenn sie während des Fahrens\ntelefonieren oder texten. Ähnliche Ergebnisse gab es sonst nur bei betrunkenen Fahrern\nmit einem Promillewert von 0,8.\nModeratorin: Dennoch wird oft, vor allem im Büro, Multitasking als Schlüsselqualifikation angesehen.\nHeinecke:\nStimmt, aber auch hier muss man einfache von komplexen Aufgaben unterscheiden. Vor\nallem im Kontakt mit anderen Menschen ist Vorsicht angebracht. Stellen Sie sich vor, Sie\nlesen bei einem Gespräch mit einem Mitarbeiter oder Kunden gleichzeitig E-Mails oder\nverfolgen andere Inhalte am Computermonitor. Ihr Gegenüber bekommt das Gefühl, er\nstört Sie bei einer wichtigen Aufgabe.\nModeratorin: Welche ist also Ihrer Meinung nach die ideale Arbeitsweise?\nHeinecke:\nAuch wenn es altmodisch klingt - die richtige Devise beim Arbeiten lautet: immer schön\nder Reihe nach. Dafür muss man aber zunächst lernen, Prioritäten zu setzen und Wichtiges von Unwichtigem zu trennen. Wenn ich etwa merke, dass ein Anruf meine ganze\nAufmerksamkeit erfordert, lasse ich die neuen E-Mails lieber einen Moment lang warten.\nModeratorin: Kommen wir einmal auf die Jugendlichen zu sprechen. Viele Eltern kennen die Situation:\nKaum aus der Schule zurück, zieht es Sohn oder Tochter wie vom Magneten angezogen\nvor den Computer. Zusätzlich läuft nebenher der Fernseher und es werden Nachrichten\ngetippt. Kommen Jugendliche besser mit Multitasking zurecht?\nHeinecke:\nNein, im Gegenteil: Studien haben gezeigt, dass Teenager bis zu viermal so viel Zeit für\nihre Hausaufgaben brauchen, wenn sie sich dabei mit anderen Dingen beschäftigen. Auch\nwenn es der Nachwuchs nicht gerne hört: Beim Lernen den Fernseher und das Radio ausmachen und das Handy ausser Reichweite legen. Manche Experten raten sogar, dass man\n30 Minuten vor und nach den Hausaufgaben keine Medien bedienen sollte.\nModeratorin: Frau Doktor Heinecke, ich danke Ihnen für das interessante Gespräch.\nHeinecke:\nGerne.\n© Praxis\n- 31 -\nTeil 3\nModerator:\nBecker:\nModerator:\nBecker:\nModerator:\nNeumann:\nModerator:\nBecker:\nModerator:\nBecker:\nModerator:\nBecker:\nModerator:\nNeumann:\nModerator:\nBecker:\nModerator:\nNeumann:\n- 32 -\n© Praxis\nModerator:\nHerzlich willkommen bei Radio PRIMA und unserer Reihe „Menschen und Horizonte“.\nHeute geht es um die Frage: Ehrenamtliches Engagement deutscher Senioren. Wie\nnutzen unsere Mitbürger im Ruhestand die vielfältigen Möglichkeiten, um die Gesellschaft\nmit- und umzugestalten? Mein erster Gast im Studio ist Frau Martha Becker. Sie ist\npensionierte Pädagogin und seit zwei Jahren ehrenamtlich tätig.\nJa, guten Tag.\nFrau Becker, Sie geben Ihr Wissen und ihre Erfahrung an junge Menschen weiter.\nJa, ich engagiere mich in einem Nachbarschaftsprojekt für sozial benachteiligte Kinder.\nDa sind wir auf Ihre Erfahrungen gespannt. Außerdem begrüße ich im Studio Herrn\nPeter Neumann. Er ist Ingenieur im Ruhestand und unterstützt ehrenamtlich technische\nProjekte im In- und Ausland.\nGuten Tag.\nFrau Becker, wie kam es denn dazu, dass Sie diese freiwillige Arbeit aufgenommen haben?\nFür mich kam nie in Frage, mich mit dem Renteneintritt zur Ruhe zu setzen. Die Freude an\nder Arbeit, am Kontakt zu anderen Menschen hört doch nicht von einem Tag zum anderen\nauf! Es geht mir, Gott sei Dank, gesundheitlich wunderbar, und meine geistigen Kräfte sind\nauch auf der Höhe. Warum also nicht?\nJa (lacht), Sie entsprechen ganz bestimmt nicht der stereotypen Vorstellung, die man sich\noft von älteren Menschen macht. Sie sind voller Dynamik und Lebensfreude.\nDanke, aber dazu trägt auch meine Beschäftigung mit den Kindern bei, denn die hält mich\njung…\nObwohl es sicher nicht immer einfach ist, sich mit sozial benachteiligten Kindern zu\nbeschäftigen. Da hat es sicher eine Rolle gespielt, dass Sie Pädagogik studiert haben.\nFür andere wäre solch eine Aufgabe wohl zu anspruchsvoll.\nIch habe mich einfach gefragt: „Was kannst du gut?“, und ich denke, ich habe das\nTalent, mit jungen Menschen umzugehen. Die Kinder brauchen vor allem Zuwendung und\naufrichtiges Interesse. Deshalb empfinde ich meine Arbeit auch nicht als selbstlose und\naufopferungsvolle Tätigkeit, sondern als Möglichkeit, aktiv am Leben teilzunehmen.\nHerr Neumann, weshalb engagieren Sie sich ehrenamtlich?\nIch denke, die Gründe für das ehrenamtliche Engagement liegen auf der Hand: Etwas\nGutes zu tun und sozial zu sein macht Spaß und stärkt das Selbstbewusstsein. Die Senioren in Deutschland wollen den Austausch zwischen Alt und Jung. Für die deutsche Gesellschaft, in der es immer mehr ältere Menschen gibt, ist das gut, weil die Generationen auf\ndiese Weise ins Gespräch kommen und voneinander lernen können.\nTrotzdem kann das gesellschaftliche Engagement der deutschen Senioren noch weiter\ngesteigert werden. Laut Statistik hat das bürgerschaftliche Engagement der Senioren in\nden letzten Jahren zwar deutlich zugenommen und liegt mit etwa 34 Prozent europaweit\nüber dem Durchschnitt, aber Wissenschaftlern zufolge geht noch zu viel ungenutztes\nPotenzial verloren.\nDas liegt meiner Meinung nach aber auch daran, dass viele von ihnen nicht wissen, wie sie\nsich als nützlich erweisen können. Da wäre es, denke ich, sinnvoll, mehr auf die Senioren\nzuzugehen und sie ausführlicher zu informieren.\nEine letzte Frage an Sie beide: Würden Sie ein solches Engagement auch anderen Senioren empfehlen?\nAus meiner persönlichen Erfahrung, ja. Ich höre immer wieder von Senioren, dass sie\nihr Leben als interessanter als zuvor empfinden und das Gefühl haben, einen wichtigen\nBeitrag zur Gesellschaft zu leisten.\nDanke Ihnen beiden für den interessanten Einblick. Liebe Zuhörerinnen und Zuhörer,\nwenn wir Ihr Interesse geweckt haben: auf unserer Website finden Sie weitere Informationen und vor allem, wo und wie Sie sich ganz in der Nähe ehrenamtlich engagieren\nkönnen.\nTeil 4\nSehr geehrte Damen und Herren, ich begrüße Sie recht herzlich zu meinem Vortrag „Vorbild Eltern:\nWie Sie Ihre Vorbildfunktion richtig einsetzen“. Ich heiße Melina Schwarz und bin als Familienberaterin\ntätig.\n„Der Apfel fällt nicht weit vom Stamm“ – dieses Sprichwort veranschaulicht die Beziehung zwischen Eltern\nund Kindern ziemlich genau. Positive wie negative Einflüsse werden an die Kinder weitergegeben. Egal ob\nes ganz alltägliche Gewohnheiten betrifft oder die Weitergabe von verschiedenen Werten: In allen Lebensbereichen gucken sich die Kleinen alle möglichen Einzelheiten von den Großen ab.\nIhr eigenes Verhalten, meine Damen und Herren, hat somit im Alltag einen großen Einfluss auf Ihr\nKind. Unter anderem erfährt es von Ihnen, wie wichtig beispielsweise Freundlichkeit, Hilfsbereitschaft,\nRücksichtnahme oder Zuverlässigkeit sind. Daher macht es wenig Sinn, Ihr Kind zum „Bitte“ und „Danke“\nzu ermahnen, wenn Sie selbst Höflichkeitsformen im Umgang mit anderen Menschen vernachlässigen.\nAber auch über die üblichen Floskeln hinaus können Sie Ihrem Kind Höflichkeit und Respekt im Alltag\nvermitteln, zum Beispiel, indem Sie es ausreden lassen, sich entschuldigen, wenn etwas schiefgelaufen ist\nund einen ruhigen, respektvollen Ton pflegen. Ihr Kind erwartet port gemacht: Ski, Fahrrad, Tennis, Hockey. Doch\nmit zwölf bekam ich plötzlich keine Luft mehr und war ständig erschöpft, konnte kaum noch Treppen\nsteigen. Meine Ärztin dachte zuerst, es würde mit meinem Wachstum zusammenhängen. Doch so war\nes nicht. Durch eine Infektion in sehr frühem Alter war mein Herz stark beschädigt, es bestand akute\nLebensgefahr. Die einzige Rettung: Herztransplantation!\nVor zwei Jahren haben sie ein passendes Spenderorgan für mich gefunden. Ich bin wieder gesund\ngeworden und darf Sport machen, aber ich muss aufpassen, um mein Herz nicht zu überfordern.\nHÖRTEXT 2\nA: Sie werden die Erasmus-Generation genannt. Jene Studenten, für die es in den vergangenen 30 Jahren\nzum Selbstverständnis geworden ist, einen Teil ihres Studiums in einem anderen EU-Land zu absolvieren. Diese Aufenthalte haben sie geprägt, waren für viele ein unvergessliches Erlebnis und haben\nnachgewiesenermaßen ihre Berufschancen erhöht.\nB: Laut einer Umfrage der EU-Kommission ist der Anteil von arbeitslosen Akademikern unter den Absolventen eines Erasmus-Studiums um 14 Prozentpunkte geringer als bei jenen, die nicht im Ausland\nstudiert haben. 93 Prozent der mobilen Studenten können sich vorstellen, später im Ausland zu leben.\nHÖRTEXT 3\nA: Guten Tag, ich möchte gern einen Bibliotheksausweis beantragen.\nB: Studieren Sie bei uns?\nA: Ja, Wirtschaftswissenschaften im ersten Semester.\nB: Studierende der Goethe-Universität Frankfurt müssen keinen Ausweis beantragen. Ihre Goethe-Card\nist der Bibliotheksausweis.\nA: Das ist ja praktisch!\nB: Sie können Ihre Goethe-Card auch als elektronische Geldbörse für die Mensa verwenden. Wenn Sie\nmit ihr dort zahlen, bekommen Sie auch den günstigeren Studierendentarif für das Essen. Und seit\nkurzem können Sie mit Ihrer Goethe-Card auch zahlreiche Museen in Frankfurt kostenlos besuchen.\nA: Toll, danke für die Auskunft.\nHÖRTEXT 4\n- 34 -\n© Praxis\nA: Mit Anfang 20 habe ich mir eine Rose auf den Rücken tätowieren lassen. Das hat zwar ungeheuer\nwehgetan, bereut habe ich meine Entscheidung allerdings nie: Die Rose ziert meinen Körper, sie ist\nein Schmuck, für den ich nichts umzuhängen brauche.\nB: Mit 18 habe ich mir auch ein Tattoo am linken Oberarm stechen lassen, aber während meines\nMedizinstudiums habe ich beschlossen, das Tattoo entfernen zu lassen. Ich finde, es ist wichtig,\ndass sich meine zukünftigen Patienten bei mir wohl fühlen und es kommen nun mal nicht alle mit\nTattoos zurecht. Aber gefallen hat mir das Tattoo immer – bis zum Schluss!\nHÖRTEXT 5\nA: Ihr möchtet mehr Platz für neue Möbel schaffen oder einfach mal richtig entrümpeln? Dann fragt ihr\neuch sicher: Wohin mit all den alten Möbeln? Unser Tipp: Spenden statt Wegwerfen. Unter diesem\noder ähnlichen Mottos gibt es zahlreiche gemeinnützige Aktionen, denn nicht nur gut erhaltene Kleidung, sondern auch Möbel werden dringend gesucht. Das Projekt \"Von Heim zu Heim\" macht es sich\nbeispielsweise zur Aufgabe, den Spendern die passende Adresse zu vermitteln, wo Möbel-Spenden in\nihrer Nähe abgegeben werden können. Die Möbel werden auf Wunsch direkt beim Spender abgeholt\nund der Dank dafür wird ebenfalls direkt ausgesprochen.\nTeil 2\nModerator:\nKleist:\nModerator:\nKleist:\nModerator:\nKleist:\nModerator:\nKleist:\nModerator:\nKleist:\nModerator:\nKleist:\n© Praxis\nModerator:\nKleist:\nBei uns im Studio ist heute Herr Doktor Jürgen Kleist, Trinkwasserexperte des Technischen\nHilfswerks. Anlass ist die Weltwasserwoche in Stockholm.\nHerr Kleist, laut der UNESCO sind 40 Prozent der Weltbevölkerung von Wasserknappheit\nbetroffen. Durch die steigende Bevölkerungszahl soll sich das noch verschlimmern. Steigt\nder Trinkwasserbedarf auch in Deutschlands wachsenden Metropolen?\nDa muss ich erst mal korrigieren. Wasser wird immer knapper, das höre ich immerzu. Die\nErde hat seit Jahrmillionen die gleiche Wassermenge. Es findet ein beständiger Kreislauf\nstatt. Es kann natürlich passieren, dass in einigen Regionen verfügbares Trinkwasser in der\nNähe von großen Metropolen knapper wird. Aber bei uns ist das nicht zu befürchten.\nWenn das alles hier nicht zu befürchten ist, warum haben die Deutschen die Gewohnheit,\nWasser zu sparen?\nIn den 1980er-Jahren dachten Experten noch, der Wasserverbrauch in den Haushalten\nwürde bis zum Jahr 2000 von 150 auf 200 Liter pro Kopf am Tag steigen. Dazu musste\ndas bestehende Wassernetz ausgebaut werden, und das erschien damals zu teuer. Also\nsollte man lieber Wasser sparen. Später war dann in den Medien und in der Öffentlichkeit\nimmer vom kostbaren Wasser die Rede.\nDer Wasserverbrauch ist dann aber nicht gestiegen, nicht wahr?\nEs ist das Gegenteil passiert: Der Verbrauch ist mittlerweile sogar um ein Fünftel gesunken, und das ist ein Problem: Hygieniker sagen, Wasser muss fließen, denn Wasser ist\nein Lebens- und Überlebensmittel, und wenn es – egal wie mühsam – gewonnen wird,\nwenn es an die Oberfläche gefördert wird, dann soll es auch möglichst schnell verbraucht\nwerden. Nur dann ist das Wasser richtig sauber, also keimfrei.\nDas Trinkwasser ist aber trotzdem in Deutschland im Vergleich mit anderen europäischen\nLändern sehr teuer. Woran liegt das?\nDas liegt daran, dass die meisten Leute denken, wenn sie Wasser sparen, sparen sie auch\nGeld. Und da irren sie sich: Das Wasser, das man fördert, das Grundwasser, das kostet\nnichts. Das ist wie Regenwasser. Wenn man aber das Grundwasser für die öffentliche\nWasserversorgung nutzen will, muss man ein Leitungsnetz legen, Rohre verlegen und das\nGanze pflegen. Das ist eben das Teure.\nKönnen wir durch unseren Umgang mit Wasser in Deutschland Einfluss auf die weltweite\nWassersituation nehmen?\nNein, absolut nicht. Global betrachtet sind wir bei den Ländern mit dem niedrigsten\nWasserverbrauch. Wenn wir Wasser sparen, tun wir der Welt keinen Gefallen. Außer wir\nsparen warmes Wasser, denn dafür braucht es Energie. Die Probleme mit Wasser sind\nlösbar. Der Welt wird das Wasser nicht ausgehen.\nAber es gibt die großen Probleme mit dem Trinkwassermangel in bestimmten Regionen\nder Welt.\nDas ist aber meistens kein Mangel an der Ressource Wasser, das ist ein Mangel an finanziellen Möglichkeiten, eine Wasserversorgung aufzubauen und zu unterhalten. Es fehlt\nnicht an Wasser, sondern an Geld. In Afrika haben Länder teilweise enorme Regenmengen, aber es gibt natürlich auch Trockengebiete. Aber das Grundproblem ist meistens,\ndass das Geld für die Infrastruktur fehlt oder die Leitungen so kaputt sind, dass sehr viel\nWasser verloren geht.\nHerzlichen Dank, Herr Doktor Kleist, für dieses interessante Gespräch.\nGern geschehen.\n- 35 -\nTeil 3\n- 36 -\n© Praxis\nModeratorin: Hallo und willkommen beim Webradio Berlin. Heute geht es um das Thema: Familien in\nDeutschland. Sie werden immer weniger, dafür aber umso bunter. Das klassische Modell –\nVater, Mutter und zwei Kinder – wird mit anderen Formen des Zusammenlebens ergänzt.\nHeute wollen wir Ihnen zwei davon vorstellen. Mein erster Gast im Studio ist Lina Krause.\nSie ist alleinerziehende Mutter und lebt mit ihrer zweijährigen Tochter in Berlin-Neukölln.\nKrause:\nHallo.\nModeratorin: Frau Krause, was bedeutet Familie für Sie?\nKrause:\nIch denke, Familie ist zuallererst dort, wo Kinder sind. Aber Familie sind für mich auch\nMenschen, die ich lange kenne, denen ich vertraue und die mit mir, meiner Tochter,\nmeiner Mutter oder meinem Bruder eine enge, eine innige Verbindung haben.\nModeratorin: In Deutschland leben mittlerweile knapp drei Millionen Alleinerziehende. Trotzdem ist das\ntraditionelle Verständnis von Familie – ein Ehepaar lebt mit Kind oder Kindern zusammen\nin einem Haushalt - immer noch weit verbreitet.\nKrause:\nJa, das habe ich auch zu spüren bekommen. Als mein Partner und ich uns trennten, bekam\nich immer zu hören, dass es ja so schade sei, dass ich jetzt keine richtige Familie mehr\nhätte. Aber für mich ist das hier die ideale Familie!\nModeratorin: Ich möchte für die nächste Frage meinen zweiten Gast begrüßen. Herr Wolfgang Schmidt\nlebt jetzt mit seiner neuen Partnerin in einer Patchwork-Familie. Zusammen haben sie\ndrei Kinder.\nSchmidt:\nGuten Tag. Ja, wir leben zu fünft in Kreuzberg. Martha hat ein Kind, und ich habe zwei.\nMeine beiden Töchter leben eine Woche bei mir, die andere Woche bei meiner Ex-Frau.\nMarthas Sohn ist die halbe Woche bei uns und die andere Hälfte bei seinem Vater. Das ist\nschon ziemlich kompliziert zu organisieren.\nModeratorin: Das glaube ich gern. Es ist schon eine Meisterleistung, den „normalen“ Familienalltag zu\nbewältigen, vor allem, wenn beide Elternteile arbeiten. Frau Krause, wie kommen Sie als\nAlleinerziehende mit der Organisation des Alltags zurecht?\nKrause:\nAlso, mit der Zeit habe ich mich zu einem Multitasking-Talent entwickelt (lacht), denn ich\nweiß von vornherein, dass ich für alles verantwortlich bin. Das ist anstrengend, wenn man\nnur auf sich gestellt ist, aber oft suche ich mir auch Hilfe bei Freunden und meiner Familie.\nModeratorin: Da sprechen Sie die positiven Seiten an, die diese Lebensform bieten kann, denn wenn\neine Partnerschaft auseinandergeht, rückt die Familie oft enger zusammen, was auch ein\ngutes Gefühl und moralische Stütze gibt.\nKrause:\nIch denke, es ist enorm wichtig für mich und mein Kind, zu wissen, dass ich mich auf diese\nMenschen verlassen kann. Zurzeit besuche ich nämlich nach der Arbeit ein Abendgymnasium, um das Abitur nachzuholen. Wenn ich es schaffe, mache ich weiter und studiere.\nModeratorin: Das schaffen Sie bestimmt! Herr Schmidt: Das Zusammenleben in der Patchwork-Familie\nist nichts Ungewöhnliches mehr, trotzdem muss man sich in die neue Lebensform erst\neingewöhnen. Wie verstehen sich denn die Kinder untereinander?\nSchmidt:\nCarla und Maria verstehen sich prima mit ihrem Stiefbruder. Aber ich denke, da hatten wir\nauch Glück. Es gibt, glaube ich, kein „Patentrezept“, nach dem eine Patchwork-Familie zu\neiner harmonischen Gemeinschaft zusammenwächst.\nModeratorin: Das ist nicht selbstverständlich. Wenn eine Familie auseinanderbricht und an beiden\nEnden neu heilen muss, ist das wohl nie einfach.\nSchmidt:\nIch denke, ob Kinder glücklich aufwachsen, hängt letztendlich auch nicht von der Familien-Variante ab. Was für mich zählt, sind Liebe, Fürsorge und Vertrauen.\nModeratorin: Frau Krause, Herr Schmidt, ich bedanke mich recht herzlich bei Ihnen für die interessanten\nEinblicke. Was denken Sie, liebe Zuhörerinnen und Zuhörer, zu unserem Thema? Kontaktieren Sie uns unter www. (ausblenden)\nTeil 4\nHerzlich willkommen, meine Damen und Herren, zu meinem Vortrag „Globalisierung – besser als ihr Ruf“.\nIch bin Torsten Meineke vom Zukunftsinstitut in Frankfurt.\nWir leben im Zeitalter der Krisen – Finanzkrise, Flüchtlingskrise, Klimakrise, ... – die uns zeigen, wo es lang\ngeht mit der Menschheit. Nämlich steil bergab. Doch dieser Blick auf die Welt ist von Angst geprägt und\nvor allem von einer Medienwelt, die es sich zur Gewohnheit gemacht hat, diese Ängste zu nutzen, um\nmöglichst viel Aufmerksamkeit auf sich zu ziehen.\nSchütteln wir diese Katastrophen-Fantasien doch einmal ab und blicken auf den Zustand der Menschheit\nals Ganzes. Die Zahl der Menschen, die in Armut leben müssen, sinkt seit einem Jahrhundert – obwohl die\nWeltbevölkerung ständig wächst. Immer mehr Menschen entkommen den schwierigen wirtschaftlichen\nund sozialen Verhältnissen.\nSolche positiven Tendenzen zeigen sich in allen möglichen Bereichen: Immer weniger Menschen auf der\nWelt müssen hungern, Großstädte werden sicherer und die Anzahl der Gewalttaten sinkt. Zum ersten Mal\nsind über 80 Prozent aller Menschen in der Lage zu lesen und zu schreiben, und erstmalig in der Geschichte der Menschheit sterben mehr Menschen an Übergewicht als an Unterernährung. Es ist also an der Zeit,\nunser Bild von Globalisierung vorsichtig zu korrigieren.\nDie globalisierte Wirtschaft hat ihre Schattenseiten, ganz klar, aber darüber darf man die Chancen und\nPotenziale einer vernetzten Welt nicht verdrängen. Inzwischen wächst eine völlig neue Generation an\nWeltbürgern heran, die sich von der ihrer Eltern grundlegend unterscheidet: Die „Generation Global“ ist\ngebildet und digital vernetzt, will durch ihr Tun etwas bewirken und verändern.\nKonsum ist dabei nicht mehr das Wichtigste, denn die Probleme der globalisierten Wirtschaft sind den\njungen Globalen bekannt. Klassisches Karrieredenken hat für sie keine Bedeutung. Es geht ihnen in erster\nLinie um interessante Erfahrungen – und darum, mit der Arbeit einen sinnvollen Beitrag zur Gesellschaft\nzu leisten. Ein Unternehmen, das sich nicht sozial oder ökologisch engagiert, wird immer nur zweite Wahl\nfür sie sein.\nKein Zweifel, mit wirtschaftlichem Einfluss finden auch kulturelle Werte und Konsumgüter ihren Weg in\nandere Gesellschaften. Das muss jedoch nicht bedeuten, dass eine Kultur über eine andere dominiert und\nsie beherrscht, nein, vielmehr verschmelzen fremde Kulturelemente mit der eigenen Kultur.\nDurch Globalisierung und Mobilität treffen Menschen unterschiedlicher Herkunft und Religion aufeinander. Sie erfahren über deren Lebensformen und Verhaltensweisen und entwickeln Respekt und Verständnis für die eigene und für fremde Kulturen. Zugegeben, problemlos und frei von Ängsten sind diese\nKontakte, besonders anfangs, nicht, aber mit der Zeit werden die Vorurteile abgebaut.\nDiese Entwicklung führt nicht nur zu einer Loslösung der Gemeinschaften von geografischen Grenzen,\nsondern auch zu einer neuen Denkweise: Herkunft, Geschlecht, Alter und Aussehen treten dabei in den\nHintergrund. Es entstehen moderne, multikulturelle Gesellschaften und immer mehr junge Menschen\nbezeichnen sich eher als Weltbürger denn als Bürger ihres jeweiligen Landes.\nMeine Damen und Herren, ich danke Ihnen recht herzlich für Ihre Aufmerksamkeit.\n© Praxis\n- 37 -\n\nFRAGEN UND AUFGABEN AUS DEM LEHRBUCH (Scan/OCR, PDF-Seiten 166–169)\n\n===== PDF-Seite 166 =====\nma\n\noa\n\n.\n\nWER|\n\nTER ne\n\n....\n\nKSTATT B2\n\neu ränk in vier verschiedenen Plastikbechern in den Farben Weiß,\nCreme, Orange und Rot. Das Kakaogetränk war in allen Bechern immer das gleiche und gleich heiß.\nIm Anschluss mussten die Probanden die Schokoladen benoten. Dabei zeigte sich: Aus dem orangen\nund dem cremefarbenen Becher schmeckte die heiße Schokolade am besten, gefolgt von der roten.\nDie Farbe Weiß schnitt also – fast überraschenderweise – am schlechtesten ab.\nHÖRTEXT 3\nA: Die Hafencity in Hamburg ist seit der Jahrhundertwende im Bau. Dieser Stadtteil ist quasi aus dem\nNichts entstanden und erfreut sich großer Beliebtheit. An die 14 000 Menschen sollen hier wohnen,\nüber 45 000 weitere einen Arbeitsplatz finden. Ein lebendiges Großstadtviertel soll es sein, mit Kitas\nund Schulen, Kneipen, Parks und bezahlbarem Wohnraum.\nB: Das alles liegt in der Nähe der Hamburger Innenstadt, dazu in direkter Nähe zum Wasser. Vor allem\njunge Familien ziehen hierher – der Anteil an Kindern bis zu 6 Jahren liegt weit über dem Hamburger\nDurchschnitt.\nHÖRTEXT 4\n- 38 -\n© Praxis\nA: Viele Menschen haben Schwierigkeiten beim Einschlafen. Die Geschehnisse des Tages und der Stress\nim Büro beschäftigen sie noch zu sehr und an Abschalten ist einfach nicht zu denken. Dagegen kann\nschon das Lesen eines guten Buches helfen. Da kann ich Ihnen folgenden fast selbstverständlich klingenden Rat geben: Es sollte sich nicht gerade um einen spannenden Krimi oder sonstige nervenaufreibende Lektüre handeln. Und die Lesezeit sollte auf 20 bis 30 Minuten beschränkt sein. Sonst kann\nes passieren, dass man den Moment des Einschlafens verpasst oder bei brennender Lampe einschläft,\nwas wiederum beim Schlafen stört.\nHÖRTEXT 5\nA: Da Kaffee so beliebt ist, ist die Kaffeeküche am Arbeitsplatz ein ganz zentraler Ort, an dem sich\nMitarbeiter begegnen, die im Büroalltag ansonsten eher wenig miteinander zu tun haben. Ein nettes\nGespräch unter Kollegen beim gemeinsamen Kaffeetrinken hebt die Stimmung und wirkt sich positiv\nauf das allgemeine Betriebsklima aus.\nB: Nicht selten entwickeln übrigens Mitarbeiter beim Kaffeetrinken auch gemeinsam Ideen und Lösungsansätze, die sich förderlich auf den Erfolg des Unternehmens auswirken können. In immer mehr\nUnternehmen lässt sich daher beobachten, dass Arbeitgeber auf gemütlich eingerichtete Coffee-Bars\noder Coffee-Corner setzen ... und ein Auge zudrücken, wenn die Kaffeepause etwas länger dauert.\nTeil 2\nModerator:\nKerner:\nModerator:\nKerner:\nModerator:\nKerner:\nModerator:\nKerner:\nModerator:\nKerner:\nModerator:\nKerner:\nModerator:\nKerner:\nIm Studio begrüße ich heute Arbeitspsychologin Doktor Eva Kerner von der Uni Hamburg.\nSie fordert, dass Arbeitssucht endlich genauso wie Glücksspiel- und Kaufsucht als eine\nernstzunehmende Krankheit anerkannt wird. Frau Kerner, woran erkennt man denn einen\nArbeitssüchtigen, einen „Workaholic“?\nDer Begriff „Workaholic“ ist mehr umgangssprachlich, der fachlich richtige Ausdruck dafür\nlautet Arbeitssüchtiger. Das sind Menschen, die übermäßig viel arbeiten – allerdings nicht\ndeshalb, weil sie dadurch mehr verdienen oder es der Karriere dienlich wäre, sondern weil\nsie einen inneren Drang danach verspüren. Workaholics agieren aus einem inneren Zwang\nheraus.\nWas unterscheidet Workaholics von anderen Arbeitnehmern mit gesunder Arbeitsmotivation?\nMan muss vor allem darauf achten, wie sehr sich die Person noch unter Kontrolle hat.\nArbeitssüchtige erkennt man weniger daran, was sie leisten, sondern eher an den Dingen,\ndie sie nicht tun. Oft haben sie nur eingeschränkte soziale Kontakte, keine Freizeit, ihre\nBeziehung leidet vielleicht unter der vielen Arbeit, sie investieren wenig Zeit in Partnerschaft und Familie. Ihr gesamtes Leben organisiert sich rund um ihre Arbeit. Workaholics\nkönnen nur schwer entspannen, abschalten oder richtig loslassen.\nIst das eine neue Entwicklung oder gab es das immer schon?\nWorkaholics gab es schon immer. Früher meinte man damit nur eine bestimmte Gruppe,\netwa Menschen, die sehr kreativ sind oder etwas erfinden. Ich gehe aber davon aus, dass\ndie Workaholics in den vergangenen Jahren stark zugenommen haben. Es ist also keine\nneue Erscheinung, aber eine, die heute viel häufiger anzutreffen ist als früher.\nHaben Sie eine Erklärung dafür?\nIn den vergangenen Jahrzehnten waren die Arbeit und das Privatleben stärker getrennt.\nWenn die Arbeitnehmer ihren Arbeitsplatz verließen, dann war „Feierabend“ und die freie\nZeit begann. Auf dem heutigen Arbeitsmarkt gibt es diese eindeutige Trennung für viele\nMenschen nicht mehr. Ein großer Teil der Beschäftigten ist auch während ihrer Freizeit\nweiter im Dienst. In ihrem Arbeitsvertrag steht, dass sie immer erreichbar sein müssen.\nWie hoch schätzen Sie die Belastung für die Familie oder das soziale Umfeld eines\n„Workaholics“?\nDie Arbeitssucht ist eine besonders starke Bedrohung für die Familie und den Freundeskreis. Nicht nur, weil sie den „Workaholic“ für große Zeitspannen von seiner Familie\ntrennt, sondern auch, weil es so aussieht, als würde der „Workaholic“ seine Arbeit für\nwichtiger halten als die Familie oder die Freunde. Wenn der Arbeitssüchtige beispielsweise immer wieder Verabredungen absagt, ist das natürlich frustrierend.\nWas kann ein Workaholic tun, wenn er sein Leben ändern möchte?\nDa gibt es eine Menge Dinge, die man tun kann. Grundsätzlich müssen Workaholics\nwieder lernen, an unterschiedlichen Dingen des Lebens Interesse und Spaß zu finden. Das\nkann Sport sein, soziale oder kulturelle Tätigkeiten. Letztlich haben sie sich ja über lange\nZeit auf einen Lebensbereich, nämlich die Arbeit, sehr konzentriert. Nun geht es darum,\nsich wieder neue Lebensbereiche zu erschließen.\nFrau Doktor Kerner, herzlichen Dank für dieses aufschlussreiche Gespräch.\nGern geschehen.\n© Praxis\n- 39 -\nTeil 3\nModerator:\nSchulz:\nModerator:\nBerger:\nModerator:\nSchulz:\nModerator:\nSchulz:\nModerator:\nBerger:\nModerator:\nSchulz:\nModerator:\nSchulz:\nBerger:\nModerator:\nBerger:\n- 40 -\n© Praxis\nModerator:\nSchön, dass Sie mit dabei sind, hier bei Radio Antenne Nord. Heute geht es um die Frage:\nFrüher lernte man seinen Flirt auf Partys kennen – heute boomen Partnersuche-Portale\nim Internet. Doch wie sieht es mit dem Online-Dating für junge Leute aus? Was erhoffen\nsie sich von Partnerbörsen? Mein erster Gast im Studio ist Daniel Schulz. Er hat seine jetzige Freundin im Internet kennengelernt.\nHallo. Ja, vor vier Monaten, über eine Singlebörse.\nHallo. Da sind wir gespannt auf Ihre Einblicke. Außerdem begrüße ich im Studio Frau Marianne Berger. Sie ist Soziologin und untersucht, wie Singles heutzutage zueinander finden.\nGuten Tag.\nZurück zu Ihnen, Herr Schulz. Warum suchen denn Ihrer Meinung nach immer mehr junge\nLeute ihren Flirt oder ihren Partner im Internet?\nWir leben nun mal in einer digitalisierten Welt. Wenn ich online shoppen gehe und soziale\nNetzwerke nutze, warum dann nicht auch online daten? Dates, also Verabredungen über\ndas Internet oder über Apps sind einfach schneller, und die Möglichkeiten, jemanden\nkennenzulernen, viel größer.\nViele Nutzer sagen sich ja: Bei Millionen von Mitgliedern müsste sich der richtige Partner\ndoch eigentlich finden lassen. Doch kann man bei einer so großen Masse an Dating-Angeboten nicht auch leicht den Überblick verlieren?\nDas glaube ich weniger, denn man muss ja auch der anderen Person gefallen und dann\nsollte die auch ähnliche Vorlieben haben. Aber manchmal hatte ich schon das Gefühl,\nbeim nächsten Date könnte es noch besser laufen, da könnte jemand sein, den man noch\nsympathischer findet.\nFrau Berger, die Nutzerzahlen von Flirt-Apps und Dating-Portalen sind in den letzten\nJahren rasant angestiegen. Was erhoffen sich die Partnersuchenden vom Online-Dating?\nZu welchen Ergebnissen sind Sie bei Ihrer Untersuchung gekommen?\nAlso, es gibt ganz unterschiedliche Motive, diese Dating-Portale zu nutzen. Die Mehrheit\nder jungen Nutzer, kann man schon sagen, ist tatsächlich auf der Suche nach einer Paarbeziehung, langfristig angelegten Paarbeziehung. Zumindest ergeben das die Befragungen.\nEs gibt aber auch Leute, die sagen, ich bin einfach neugierig und nutze das einfach mal,\nweil so viel drüber gesprochen wird.\nBei Ihnen hat es anscheinend geklappt, Herr Schulz.\nJa (lacht), und das Komische ist, wir wohnen in derselben Gegend und studieren an\nderselben Uni, aber wir waren uns vorher noch nie über den Weg gelaufen.\nMeistens findet das erste „wirkliche“ Treffen erst Wochen nach dem Online-Kennenlernen statt. Wie ist das denn beim ersten Date? Entspricht die Person den Vorstellungen,\noder steht man am Ende vor einer Überraschung?\nAlso, zuerst sieht man ja nur das Profil, da kommt es oft vor, dass man ganz bestimmte\nErwartungen hat: die eigene Fantasie „erfindet“ sozusagen ein Wunschbild von der\nPerson. Die Realität ist dann oft komplett anders. Das kann lustig sein oder spannend sein,\naber manchmal ist es wirklich peinlich.\nWenn man tatsächlich das Ziel hat, einen Partner kennenzulernen, dann sollte man sich\nmöglichst so darstellen, wie man ist, denn dann hat man, zumindest ergab das die Studie,\nden größten Erfolg.\nEine letzte Frage: Hat das „traditionelle“ Kennenlernen über gemeinsame Bekannte nun\nausgedient?\nIm Gegenteil! Überraschenderweise gaben die Befragten an, dass man immer noch die\nbesten und stabilsten Beziehungen findet, wenn man über den Freundeskreis, über den\nArbeitsplatz oder auch über Partyabende jemanden kennenlernt.\nIch danke Ihnen beiden herzlich für das Gespräch. Liebe Zuhörer, haben Sie Erfahrungen\nmit Online-Dating? Rufen Sie uns an! Die Telefonnummer ist (ausblenden).\nTeil 4\nSehr geehrte Damen und Herren, im Rahmen unserer Themenreihe „Psychologie des Alltags“ begrüße\nich Sie recht herzlich zu meinem Vortrag „Mit Ärger umgehen“. Ich bin Marianne Sperber von der Uni\nDuisburg.\nWenn es Ihnen wie den meisten Menschen geht, dann vergeht kein Tag, ohne dass Sie sich über Ihre\nMitmenschen oder sich selbst ärgern. Hier zwei Beispiele: Jemand nimmt Ihnen die Vorfahrt oder schnappt\nIhnen den Parkplatz weg. Ihr Monatsticket für die öffentlichen Verkehrsmittel liegt zu Hause, Sie werden\nkontrolliert und müssen zahlen. Egal wie oft, so was kann passieren und ist immer unangenehm.\nÄrger gehört einfach zum Alltag dazu, daran besteht kein Zweifel. Laut Statistik ärgern wir uns zweimal in\nder Woche kräftig, nach durchschnittlich einer Stunde vergeht das Gefühl wieder. Ärger und Wut zählen zu\nden Basis-Emotionen wie Angst, Ekel, Traurigkeit, Überraschung oder Freude. Sie kommen in unterschiedlichster Dosierung daher, vom flüchtigen Gefühl der Verärgerung über die nagende Frustration bis zum\nbebenden Zorn. Das Spektrum ist breit, die Grenzen sind fließend.\nMenschen, die sich ärgern, haben eine typische und unverwechselbare Mimik: zusammengezogene\nAugenbrauen, geweitete Pupillen, böser Blick. Für den Körper gilt höchste Alarmstufe. Das funktionierte\nbei den Steinzeitmenschen, und genauso ist es in der heutigen Zeit. Der Blutdruck und der Puls steigen, die\nAtmung wird flacher, die Muskulatur wird besser durchblutet, der Körper ist sozusagen bereit zum Angriff.\nAber was soll der Ärger eigentlich? Ist er mehr als nur ein genetisches Erbe, das für schlechte Stimmung\nsorgt? Ärger kann auch heute noch sehr sinnvoll und hilfreich sein. Es ist ein unangenehmes Empfinden,\nwelches uns sehr deutlich anzeigt, dass wir etwas verändern wollen. Das muss nicht zwangsläufig mit einer\nHandlung einhergehen, Ärger kann durchaus verbal ausgedrückt werden. Dem Chef verärgert zu sagen,\ndass das Meeting am Abend eine schlechte Idee ist, könnte allerdings neuen Ärger auslösen, diesmal\nbeim Chef.\nWie geht man nun aber am besten mit Ärger um? Ärger einfach zu unterdrücken, ist ungesund für Leib\nund Seele. Aber auch ungehemmte Wutausbrüche bringen nicht viel. Studien zeigten: Wer losbrüllt, baut\nseinen Ärger nicht ab, sondern bleibt auf dem hohen Ärger-Niveau stehen. Gleiches gilt für diejenigen, die\nihren Ärger schweigend schlucken.\nBeste Lösung ist nach Auffassung der Stressforscher die Ärger-Kontrolle. Es gilt, den Ärger bewusst wahrzunehmen und ihn gezielt zu regulieren. Eine effektive Methode ist die Verzögerung: dreimal tief durchatmen, dann bis zehn zählen, und sich nun überlegen, was genau mich gerade so wütend macht.\nWirksam ist nach Ansicht der Experten auch der gedankliche Seitenwechsel: Der Porsche, der den Radweg vor der Apotheke zuparkt, ist plötzlich kein Ärgernis mehr, wenn man erfährt, dass der Fahrer ganz\ndringend ein Medikament für seine kleine Tochter benötigt. Sich vorzustellen, dass der andere gute\nGründe für sein Handeln hat, sorgt für innere Balance.\nEine abschließende Bemerkung: Ärger ist kein Vorteil der Erwachsenen, Kinder ärgern sich auch.\nDas Schreien eines Babys kann schon Ausdruck von Ärger sein. In der Schule gibt es täglich Anlass für\nÄrger, sei es über die strenge Lehrerin oder die doofen Schulkameraden. In diesem Alter finde ich besonders interessant, dass man sich oft auch über seinen besten Freund ärgert, was Erwachsene viel seltener\ntun. Aber dieser Ärger vergeht schnell, zum Glück.\nHerzlichen Dank für Ihre Aufmerksamkeit, meine Damen und Herren.\n© Praxis\n- 41 -\n\nFRAGEN UND AUFGABEN AUS DEM LEHRBUCH (Scan/OCR, PDF-Seiten 183–186)\n\n===== PDF-Seite 183 =====\nnern,\n\nlee\n\nWERKST,\n\nATT B2\n\nee\n\na SOS HTIE Ly wuraisraeree\n\n10\n\nm\n\n10\n\nnf Gespräche und Äußerungen aus dem Alltag. Sie h\n\n>\n\ngie hören fü\n\nA\n\nOren jeden Text einmal, Wählen Sie bei den\n\ngaben die ri\n\nichtige Lösung Richtig oder Falsch und a, b oder\n\nc.\n\njesen sie jetzt das Beispiel. Dazu haben Sie 10 Sekunden Zeit.\n\np Beispiel\n\n)\n\nair-Cafés\" werden elektronische\n\nrichie\n\nite mit abgelaufener Garantie zum\n\nf angeboten\n\nrin ein „Repair-Caf&“ geht, weiß, ...\n\n>.\n\nx Aufgabe\n\n‘\n\nan\n\n1 Wir werfen viel weg, weil wir unüber-\n\n| | Richtig |-] Falsch j\n\n®\n\nlegt einkaufen.\n\n|\n\nPhe\n\nvo\n\n2 Bes
