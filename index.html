 eingeschult wurde, ist er öfter krank und meine Frau muss natürlich zu\nHause bleiben. Dann sammelt sich aber bei ihr im Büro sehr viel Arbeit an, am Ende landet sie –\nfürchte ich – im Krankenhaus.\nB: Aber du hast doch als Mann auch das Recht, zu Hause zu bleiben, um dein krankes Kind zu betreuen!\nDazu musst du lediglich einen Antrag bei deiner Krankenkasse einreichen. Die Krankenkasse springt\nein, wenn Eltern mit kranken Kindern zu Hause bleiben und der Arbeitgeber keine Lohnfortzahlung\nleistet. Anspruch auf das sogenannte Kinderpflegekrankengeld besteht bei Kindern bis zu zwölf Jahren.\nHÖRTEXT 2\nA: Für stolze 100.000 Euro ist die teuerste Rum-Flasche der Welt verkauft worden. Ein italienischer\nKäufer erwarb den Rum der Traditionsmarke Clément von der Insel Martinique, Jahrgang 1966, in\neiner mit 200 Gramm Gold und vier Karat Diamanten verzierten Kristallflasche, wie Clément und der\nPariser Juwelier Tournaire der Presse mitteilten. Der Deckel der Flasche ist eine Nachbildung eines\nhistorischen Gebäudes auf der Karibik-Insel Martinique. Der Name des Käufers wurde nicht bekannt.\nClément-Rum des Jahrgangs 1966 wurde noch nie verkauft, davon gibt es nur rund 40 Flaschen.\nHÖRTEXT 3\nA: Die bei Zoobesuchern in Washington besonders beliebte Panda-Bärin Bao Bao hat am Dienstag\ndie US-Hauptstadt in Richtung China verlassen. Der 16-stündige Direktflug an Bord eines Spezialtransporters bringt die dreieinhalbjährige Bärin in das als Panda-Welthauptstadt geltende Chengdu,\nwo sie an einem Reproduktionsprogramm für die bedrohte Tierart teilnehmen wird.\nB: In China werden Pandas sehr verehrt. Schätzungen zufolge leben noch rund 1800 wilde Pandabären\nin der Provinz Sichuan. Den Flug dürfte Bao Bao übrigens vor allem fressend verbringen, rund 30\nKilogramm Futter – vor allem Bambuspflanzen – wurden dafür mit verladen.\nHÖRTEXT 4\n-2-\n© Praxis\nA: Nach einer neuen Studie verschmutzen Plastikpartikel aus synthetischen Kleidungsstücken und\nAutoreifen die Meere in bislang nicht bekanntem Ausmaß. Die meist nur wenige Millimeter großen\nTeilchen könnten bis zu einem Drittel des sogenannten Plastikmülls im Meer ausmachen.\nB: Nach Schätzungen der Weltnaturschutzunion IUCN gelangen jedes Jahr weltweit fast 10 Millionen\nTonnen Plastik ins Meer. Tägliche Aktivitäten wie Kleidung waschen und Auto fahren tragen erheblich\nzur Verschmutzung bei, die unsere Ozeane erstickt.\nA: Plastikteile gefährden Lebewesen im Meer, bestimmte Stoffe sammeln sich wahrscheinlich in der\nNahrungskette an. Das könnte auch für Menschen gefährlich werden.\nHÖRTEXT 5\nA: Im Jemen herrscht seit zwei Jahren Krieg, der Südsudan ist ebenfalls vom Krieg zerrissen und in Somalia ist die Bevölkerung von Dürre bedroht. Das Ergebnis: Wegen Mangelernährung droht knapp einer\nMillion Kindern der Hungertod.\nB: Anthony Lake, Geschäftsführer von Unicef, dem Kinderhilfswerk der Vereinten Nationen, meinte dazu:\n„Noch können wir Leben retten. Wir dürfen nicht vergessen, dass die schwere Mangelernährung und\ndie sich abzeichnende Hungersnot von Menschen verschuldet sind. Menschlichkeit verlangt schnelleres\nHandeln. Die Tragödie von 2011 mit der Hungersnot am Horn von Afrika darf sich nicht wiederholen!“\nTeil 2\nModerator:\nHerr Appel:\nModerator:\nHerr Appel:\nModerator:\nHerr Appel:\nModerator:\nHerr Appel:\nModerator:\nHerr Appel:\nModerator:\nHerr Appel:\nModerator:\nHerr Appel:\nBei mir im Studio ist heute Doktor Sigmar Appel. Doktor Appel ist Psychiater und seit\nJahren in der Forschung tätig. Ihn interessieren besonders kausale Zusammenhänge,\ndie sich auf die Psyche des Menschen auswirken. Doktor Appel, nennen Sie uns bitte\nein Forschungsergebnis, das selbst Sie überrascht hat.\nWie wäre es damit: Eine Untersuchung der University of California hat ergeben: Mit dem\nAlter lassen zwar körperliche Fitness und kognitive Hirnleistungen nach, aber das psychische Wohlbefinden nimmt immer weiter zu.\nKlingt schon paradox.\nSehen Sie: Menschen im Alter zwischen 20 und 40 klagen im Schnitt häufiger über Stress,\ndepressive Stimmungen sowie Angstgefühle und schätzen ihr seelisches Wohlbefinden\ndeutlich geringer ein. Ältere Menschen dagegen erkranken generell seltener an psychischen Störungen als jüngere, wenn man natürlich vom erhöhten Risiko einer Demenzkrankheit absieht. Offenbar beeinflusst in diesem Alter das natürliche Nachlassen des\nGedächtnisses und anderer kognitiven Leistungen das Wohlbefinden und die Lebensfreude kaum.\nUnd welche Erklärung gibt es dafür?\nWarum sich die altersbedingten Defizite so wenig auf die psychische Verfassung auswirken, bleibt vorerst ungeklärt. Vielleicht sind dafür im Alter veränderte Hirnfunktionen\nverantwortlich, die widerstandsfähiger gegen körperlichen und sozialen Stress machen.\nÄltere Menschen haben möglicherweise gelernt, besser mit Stress und negativen Gefühlen umzugehen und haben weniger Probleme mit ihren Mitmenschen. Oder es gibt im\nAlter weniger psychische belastende Einflüsse als in jüngeren Jahren.\nWas bedeutet das denn für die jüngeren Generationen?\nEs muss einfach mehr getan werden, um die psychische Gesundheit von jungen Erwachsenen zu schützen. Das Alter zwischen 20 und 40 ist eine besonders kritische Lebensphase:\nMan sucht einen Partner, baut an der beruflichen Karriere und hat finanzielle Probleme.\nDas alles sind Risikofaktoren, die sich mehr oder weniger stark auf die Psyche auswirken\nund das Wohlbefinden beeinträchtigen können.\nWas können Sie uns noch Interessantes berichten?\nEine weitere Untersuchung, ebenfalls aus Amerika, betraf ältere Ehepaare, 50 bis 94 Jahre\nalt. Die Wissenschaftler kamen zu folgender Erkenntnis: Der Gesundheitszustand älterer\nMänner und Frauen ist umso besser, je zufriedener der Ehepartner mit seinem Leben ist.\nMoment. Was die meisten von uns annehmen, ist, dass glückliche Menschen gesünder\nsind als unglückliche.\nStimmt! Sie haben ein stärkeres Immunsystem, leiden weniger unter Stress und leben\nlänger. Aber darüber hinaus und unabhängig davon besteht offenbar ein weiterer enger\nZusammenhang: Ein glücklicher Partner fördert die Gesundheit des anderen auf unterschiedliche Art und Weise: durch verstärkte Fürsorge, praktische Lebenshilfe sowie durch\nAnregungen zu einer gemeinsamen gesunden Lebensweise. Dagegen hemmt die negative\nStimmung eines unglücklichen Partners Motivation und Energie.\nTreffen denn diese Zusammenhänge auch auf jüngere Paare zu? Sind sie auch für die\nsozialen Beziehungen zwischen Freunden, Nachbarn und Arbeitskollegen von Bedeutung?\nDas müssen weitere Studien klären.\n© Praxis\n-3-\nModerator:\nHerr Appel:\nDann warten wir so lange ab und laden Sie wieder zu uns ein. Herzlichen Dank, Doktor\nAppel!\nAuf Wiedersehen!\nTeil 3\n-4-\n© Praxis\nModeratorin: Guten Abend, liebe Zuhörerinnen und Zuhörer, herzlich willkommen bei der „Frage der\nWoche“, der Sendung für Leute, die gern diskutieren. Die Frage, die heute im Mittelpunkt\nsteht, ist im Kern nicht neu, deshalb will ich sie bewusst provokativ stellen: „Wann ist\nendlich Schluss mit Schulnoten?“ Ich möchte gleich meinen ersten Gast, Herrn Michael\nBrinkmann, Leiter des Heinrich von Kleist-Gymnasiums in Würzburg, um eine Antwort\nbitten.\nBrinkmann:\nWenn Sie mich so direkt fragen, könnte ich vielleicht genauso provokativ zurückfragen:\n„Wie stellen Sie sich eine Schule ohne Schulnoten vor?“ Denn Schulnoten sind keine\nErfindung unserer Zeit, schulische Leistungen wurden ja schon immer kontrolliert und\nbewertet.\nModeratorin: Lassen Sie uns gleich unseren zweiten Gast im Studio dazu Stellung nehmen. Frau Sonja\nFlosser wohnt in Offenbach und hat gerade Abitur gemacht. Frau Flosser, sind Schulnoten\nwirklich notwendig im Leben?\nSonja Flosser: Nach zwölf Jahren Schule hat man als Einzelperson eine klare Meinung zum Thema.\nWichtig ist aber, denke ich, nicht die Meinung des Einzelnen, sondern, wie die Leute im\nAllgemeinen darüber denken. Und da bin ich fest davon überzeugt, dass die Mehrheit\nder Schüler und Eltern keinerlei Probleme mit Schulnoten haben.\nBrinkmann:\nWas man nicht vergessen sollte: Jede einzelne Schulnote ist nicht eine einfache Ziffer, dahinter stecken endlos viele Stunden von Arbeit und Korrekturen. Noten sind in erster Linie\nBelohnungszeichen und Verbesserungsvorschläge.\nModeratorin: Da stimme ich Ihnen gern zu, aber ich habe den Eindruck, dass aus diesen sagen wir\nOrientierungshilfen seitens der Schüler und deren Eltern nicht immer Konsequenzen,\nbesser gesagt die richtigen Konsequenzen gezogen werden.\nSonja Flosser: Ich habe zum Beispiel das Abi gemacht, weil ich unbedingt studieren wollte, und zwar\nMedizin, eine Fachrichtung, die bekanntlich sehr gute Noten voraussetzt. Die Noten\nhatten also in meinem Fall eine informierende und zugleich motivierende Wirkung.\nBrinkmann:\nHaben Sie denn Ihr Ziel erreicht?\nSonja Flosser: Leicht war es nicht, aber ich hab’s geschafft. Und wissen Sie: Als Erste hat mir meine beste\nFreundin gratuliert, die selbst eine schwache Schülerin war, keine guten Noten hatte und\nnun keine andere Lösung hat als eine Lehre als Köchin zu beginnen.\nBrinkmann:\nDa sprechen Sie einen sehr wichtigen Aspekt des Themas an. Ich bin sicher, Ihre Freundin\nwird in ihrer Lehre genauso glücklich und erfolgreich sein wie Sie, Frau Flosser, in Ihrem\nMedizinstudium. Anhand von Schulnoten darf man nämlich kein Persönlichkeitsurteil\nfällen, und auch kein Belohnungssystem damit verknüpfen.\nModeratorin: Tja, heißt das dann aber, ohne Noten hätten wir das Problem nicht? Kritiker des Notensystems vertreten nämlich die Ansicht, dass es, solange es Noten gibt, Verlierer geben\nwird, besonders Kinder, die schon im Alter von acht, neun Jahren so demoralisiert und\ndemotiviert sind, dass sie absolut keine Lust zum Lernen haben.\nSonja Flosser: Ich möchte fragen: Gibt es denn echte Alternativen zu den Ziffernnoten, wie wir sie alle\nkennen?\nBrinkmann:\nNun, es gibt immer wieder Versuche in der Richtung. Haben Sie schon mal von\nBerichtszeugnissen, Rasterzeugnissen oder Briefzeugnissen gehört? Da wird die Meinung\ndes Unterrichtenden über den Leistungsstand des Unterrichteten schriftlich festgehalten.\nSonja Flosser: Ja, das habe ich in der Grundschule erlebt. Damals war ich zu jung, das Thema hat mich\nnicht interessiert. Aber die meisten Eltern hatten Probleme, die in diesen Zeugnissen\nverwendete Sprache zu verstehen, sie haben dann den Lehrer gefragt: „Schön und gut,\nwelche Note wäre das denn jetzt?“\nModeratorin: Frau Flosser, Herr Brinkmann, vielleicht hätte man zwischen einem Lehrer und einer\nEx-Schülerin eine kontroverse Diskussion erwartet, aber ich zumindest habe es angenehm\nempfunden, dass so vernünftig diskutiert wurde. ich danke Ihnen fürs Kommen!\nTeil 4\nSehr geehrte Damen und Herren, ich heiße Hartmut Kirchner und bin als Psychologe an der Universitätsklinik Gießen tätig. Im Mittelpunkt meines heutigen Vortrags in der Reihe „Menschen wie du und ich“ steht\neine ganz besondere Art von Mitmenschen, nämlich die Gruppe der Autisten, das heißt jene Individuen, die unter Autismus leiden, einer schweren Entwicklungsstörung, die für manch einen unter uns noch\nimmer wie ein Fremdwort klingt.\nDer Begriff „Autismus“ geht auf den Schweizer Psychiater Eugen Bleuler zurück, die Ursache von Autismus\nist nicht geklärt. Ein genetischer Defekt ist bislang nicht entdeckt worden, die Wissenschaftler gehen aber\ndavon aus, dass es teilweise eine genetische Wurzel gibt.\nInteressant ist Folgendes: Weltweit sind nach Angaben der Vereinten Nationen etwa ein Prozent der Weltbevölkerung Autisten, also rund 70 Millionen Menschen. Es ist also durchaus möglich, dass sich auch in\nIhrem Kollegen- oder Bekanntenkreis ein paar Autisten befinden.\nFachlich sind Autisten am Arbeitsplatz oft gar nicht eingeschränkt, Probleme haben sie eher im informellen Bereich. Manche kommen zum Beispiel regelmäßig zu spät, sprechen sich nicht mit Kollegen ab, beteiligen sich nicht am Small Talk in der Kantine und gelten unter Umständen als arrogant.\nDas kann natürlich zu einer ungewollten Diskriminierung der Betroffenen führen. Kindern mit einer\nautistischen Störung wird der Zugang zur angestrebten Schulform verweigert, Erwachsene haben meist\nkaum Chancen auf einen Platz in einer WG oder einen Arbeitsplatz in einer Werkstatt mit viel Personal. So\nentsteht eine Benachteiligungsspirale, von unzureichender Schulbildung über fehlende Arbeit bis hin zu\ngeringem Einkommen, die diese Menschen aus der Gesellschaft verdrängt.\nAutisten, die sich um eine Stelle bewerben, könnten zu 80 bis 90 Prozent schon im Vorstellungsgespräch\nscheitern. Einige im Bereich der Informationstechnologie tätige Firmen stellen aber inzwischen gezielt\nqualifizierte Menschen mit dem Asperger-Syndrom ein, einer leichteren Form des Autismus.\nDer Umgang mit Kollegen und Kunden stellt für beide Seiten eine Herausforderung dar: Autisten haben\nein Problem, Gestik und Mimik ihres Gegenüber korrekt zu entschlüsseln, sie verstehen oft nicht, was der\nandere meint. Ihr Kernproblem ist, dass sie nicht zwischen den Zeilen lesen können.\nHeilen kann man Autismus nicht. Die Betroffenen müssen lernen, mit den Symptomen umzugehen. Gestik\nund Mimik müssen sie sich wie Vokabeln einprägen. Es gibt Menschen, die unter dem Asperger-Syndrom\nleiden und es trotzdem bis zum Professor gebracht haben.\nIn vielen Ländern gibt es jedoch für Autisten noch immer keine besondere Fürsorge, die es ihnen\nermöglichen würde, wie alle anderen ihr Recht auf Gesundheit, Bildung, Beschäftigung und Teilhabe am\ngesellschaftlichen Leben zu verwirklichen. Oft werden sogar im Rahmen einer vermeintlichen Behandlung\nPraktiken eingesetzt, die ihre Menschenrechte verletzen.\n© Praxis\n-5-","S":"SCHREIBEN (Lehrbuch, OCR)\nTeil 1\nAutgabe: Einen Forumsbeitrag zu einem bestimmten Thema verfassen (Umfang: mindestens 150\nter). Zum Thema werden 4 Inhaltspunkte in sinnvoller Reihenfolge vorgegeben.\nZu beachten ist Folgendes:\n: der vier Punkte muss inhaltlich sinnvoll und in angem  der Geräusche\nwerden in einem Studio der Firma absorbiert. Das ist so viel, dass der Raum in das Guinness-Buch\nder Rekorde aufgenommen wurde.\nHÖRTEXT 2\nA: Und hier noch Interessantes aus dem Bereich „Digitale Bildung“: In den meisten Schulen ist die Benutzung von Handys und Smartphones verboten, da diese den Unterricht stören. Doch auch skeptische\nLehrkräfte sind mittlerweile nicht mehr dagegen, wenn Lernende per Smartphone schnell ein historisches Datum in Wikipedia nachschauen, den Taschenrechner benutzen, Wörter übersetzen, im\ndigitalen Wörterbuch nachschlagen oder sich ein Diktat diktieren lassen.\nB: Die Zukunft wird wohl dafür sorgen, dass Schülerinnen und Schüler die Medien, die sie ohnehin dabei\nhaben, auch sinnvoll im Unterricht nutzen können.\nHÖRTEXT 3\nA: Sobald das Summen einer Stechmücke ertönt, dauert es meist nicht mehr lang, bis der Blutsauger\nsticht und der Gestochene von Juckreiz geplagt wird. Ein feuchtes Frühjahr oder die Erwärmung\nstehender Gewässer sind unter anderem Gründe für die sommerliche Mückenplage. Wer in der\nwarmen Jahreszeit etwas gegen eine mögliche Invasion tun will, arbeitet am besten mit Mückenschutzmitteln. Die beste und längste Wirkung zeigen Sprays, während tragbare Geräte, die die Stecher\ndurch Schallwellen zu vertreiben versprechen, sich als nutzlos erwiesen. Einige Kommunen versprühen zudem großflächig Insektengifte.\nHÖRTEXT 4\n-6-\n© Praxis\nA: Ich muss morgen Vormittag in Hamburg sein. Gibt es noch Plätze im Nachtzug?\nB: Einen Moment – ja, ab Zürich fahren Sie mit dem „Euro-Nachtexpress“. Abfahrt Zürich um 20 Uhr,\nAnkunft in Hamburg um 08.24 Uhr. Allerdings müssen Sie morgen früh in Berlin in den Intercity\numsteigen.\nA: Das macht nichts. Hauptsache, ich komme pünktlich an. Ist das die schnellste Verbindung?\nB: Es fährt noch ein Direktzug nach Hamburg, der kommt zwar eine halbe Stunde später an, aber mit\neiner Ermäßigungskarte kostet Sie das rund 25 % weniger. Beide Züge sind buchungspflichtig.\nA: Hm, warum nicht? Mein Bewerbungsgespräch ist erst um 10 Uhr, also nehme ich doch lieber den\nDirektzug.\nHÖRTEXT 5\nA: Zurück zum Thema „Karriere mit Kind“: Nach einer Elternzeit kehren Frauen besonders häufig in Teilzeit in\nihren Job zurück - verständlicherweise: Besonders, wenn die Kinder noch klein sind, brauchen sie viel Betreuung und Aufmerksamkeit. Das geht aber auf Kosten des Gehalts und des beruflichen Weiterkommens.\nB: Auch sind viele Arbeitgeber wenig flexibel, wenn es um Teilzeitmodelle und Homeoffice-Tage für ihre Mitarbeitenden geht. Die Generation, die solche Arbeitsmodelle unterstützt, ist jetzt erst am Heranwachsen.\nA: Hier haben es nur verbeamtete Lehrerinnen gut, sie können ihre Arbeitsstunden jederzeit reduzieren\nund wieder erhöhen. Deshalb ist der Lehrerberuf einer der besten für Frauen, die Kinder und Job\nvereinbaren wollen.\nTeil 2\nModerator:\nIm Studio begrüße ich heute Doktor Erich Körner. Doktor Körner ist Neurobiologe und\nMitarbeiter am „Forschungszentrum für experimentelle Psychologie“. Er untersucht die\nAuswirkungen körperlicher Aktivität auf das kreative Denken. Doktor Körner, Ihre Untersuchungen bestätigen, was viele schon geahnt oder selbst erfahren haben: Beim Laufen\nkommen die besten Ideen.\nDoktor Körner: Stellen Sie sich vor: Sie sitzen im Büro schon länger an einer Aufgabe, trinken Kaffee,\ndiskutieren mit Kollegen und überlegen, Ihnen will aber einfach keine gute Lösung\neinfallen. Kurz nachdem Sie das Büro verlassen, ist sie plötzlich da – die brillante Idee,\nso langersehnt und doch so einfach. Dabei muss man nicht einmal joggen oder eine andere Sportart treiben.\nModerator:\nMan weiß ja, dass Bewegung gut fürs Gehirn ist. Schneiden fitte Menschen also besser ab\nin punkto Kreativität?\nDoktor Körner: Körperliche Aktivität verbessert zwar generell die Denkleistung. Tatsache ist aber, dass\nder günstige Einfluss auf die Ideenfindung nicht dadurch zu erklären war. Das Gehen\nbeeinflusst offenbar bestimmte Körperfunktionen, deren positive Wirkung auf kreatives\nDenken sogar nach dem Hinsetzen noch eine Zeitlang anhält. Ein angeregter Kreislauf,\nchemische Botenstoffe, die in Gang gesetzt werden, und eine verbesserte Stimmung\nkönnten eine Rolle bei der Erzeugung von kreativen Ideen spielen.\nModerator:\nWie lässt sich denn eine erhöhte Kreativität überhaupt messen?\nDoktor Körner: Nicht alles, was neu und originell ist, ist automatisch kreativ. In der Wissenschaft gilt\nein Mensch als kreativ, der in der Lage ist, Dinge oder Ideen zu produzieren, die neu,\nungewöhnlich und nützlich sind.\nModerator:\nWie soll man sich das vorstellen?\nDoktor Körner: Bei einem der Tests geht es etwa darum, möglichst viele ungewöhnliche Verwendungsmöglichkeiten für Alltagsgegenstände aufzuzählen. Eine Testfrage ist etwa: Beschreiben\nSie die verschiedenen Nutzungsmöglichkeiten einer Zeitung. Je ungewöhnlicher die Einfälle, desto höher ist die Bewertung. Wer etwa sagt: Man kann die Artikel aus der Zeitung\nschneiden und einen Erpresserbrief daraus basteln, der bezieht sich nur auf die Nutzung\nder Buchstaben. Wer auch antwortet: Man kann damit verschütteten Kaffee aufwischen,\nder fügt eine weitere Kategorie hinzu, ist also flexibler. Zudem wird die Originalität gewertet: Wer eine Nutzungsmöglichkeit findet, die keinem anderen Testteilnehmer eingefallen\nist, der schneidet hier besonders gut ab.\nModerator:\nUnd das waren in diesem Fall die Spaziergänger?\nDoktor Körner: Genau. Während und kurz nach dem Gehen war die Kreativität bei 81 Prozent der Teilnehmer erhöht. Dabei war das Spazieren in abwechslungsreicher Umgebung effektiver als\ndas Gehen in einem Zimmer vor einer weißen Wand. Hohe Werte wurden, wie erwartet,\nbei schönem Wetter und angenehmen Temperaturen gemessen.\nModerator:\nWelche vergleichbaren Aktivitäten fördern die Kreativität?\nDoktor Körner: Bisher ist noch nicht untersucht, ob auch andere Formen leichter körperlicher Aktivität\neine ähnliche Auswirkung wie das Gehen haben. Viele Menschen behaupten, dass ihnen\ndie besten Gedanken beim Gehen kommen. Nachdem unsere Studie zu dem gleichen\nSchluss gelangt ist, wollen wir nun herausfinden, warum das so ist.\n© Praxis\n-7-\nModerator:\nWir können schon jetzt von den neuesten Studienerkenntnissen profitieren – mit einem\neinfachen Spaziergang. Doktor Körner, ich danke Ihnen für dieses interessante Gespräch.\nDoktor Körner: Gern geschehen!\nTeil 3\nModerator:\nHofmann:\nModerator:\nHofmann:\nModerator:\nBauer:\nModerator:\nHofmann:\nModerator:\nBauer:\nModerator:\nBauer:\nHofmann:\nModerator:\nHofmann:\nBauer:\n-8-\n© Praxis\nModerator:\nWillkommen beim City-Radio Mannheim und unserer Sendung „Immer wieder montags“.\nDas Thema heute: Organisation des Alltags. Gibt es so etwas wie eine ‚goldene Regel‘, mit\nder man Hektik, Druck und Zeitnot, die unseren Alltag bestimmen, in den Griff bekommt?\nAls erste begrüße ich im Studio Frau Ilona Hofmann. Sie ist Biologin und Mutter von zwei\nKleinkindern.\nJa, guten Tag.\nGuten Tag, Frau Hofmann, ich stelle es mir nicht leicht vor, als erwerbstätige Mutter den\nAlltag zu organisieren.\nNa ja (lacht), inzwischen sind meine beiden Töchter im Vorschulalter, und mein Mann und\nich sind ein eingespieltes Team. Das hilft!\nUnser zweiter Gast im Studio ist Anton Bauer, dualer Student an der Fachhochschule\nDüsseldorf.\nHallo.\nZurück zu Ihnen, Frau Hofmann. Immer mehr Frauen wollen trotz Familiengründung nicht\nauf ihre Karriere verzichten. Wie gehen Sie persönlich mit dieser doppelten Belastung\num?\nAlso, ich glaube, das ist in erster Linie eine Frage der Organisation. Ich meine damit so einfache Dinge wie: Wer bringt die Kinder morgens in den Kindergarten, wer holt sie wieder\nab, wie teilt man die Arbeit im Haushalt auf, und so weiter. Da muss man den Tag ganz klar\nplanen und Prioritäten setzen.\nHerr Bauer, Sie sind dualer Student, das heißt, Sie studieren und arbeiten parallel. Wie\nkommen Sie denn mit Ihrem Tagesprogramm zurecht?\nJa, also, manchmal wünsche ich mir, mein Tag hätte mehr als 24 Stunden. Arbeit genug\ngibt es: Um halb acht in der Früh bin ich im Büro, und nach der Arbeit, wenn die anderen\nFeierabend haben, besuche ich Vorlesungen.\nZeitmangel ist ja bekanntlich ein wichtiger Stressfaktor, noch dazu, wenn man viel Arbeit\nhat. Welche Mittel nutzen Sie, um Ihren Alltag zu strukturieren?\nNormalerweise mache ich mir eine To-Do-Liste: ich liste auf, was ich tagsüber zu erledigen\nhabe. Das hilft mir, den Tag einzuteilen, auch wenn ich bis zum Abend nicht alles abgearbeitet habe.\nDas hätte ich auch machen sollen, als meine Töchter noch sehr klein waren. Wahrscheinlich hätte ich aber am Ende des Tages ein schlechtes Gewissen, weil zu viele unerledigte\nPunkte auf meiner Liste standen (lacht).\nMal eine andere Frage an Sie beide: Bleibt bei so viel Alltagshektik nicht das Private auf\nder Stecke?\nIch denke, man muss sich hin und wieder eine Auszeit gönnen. Sonst kommen Freunde\nund die Familie zu kurz. Das kann ein entspannender Spaziergang oder ein freier Abend\nmit Freunden sein, aber manchmal habe ich auch das Bedürfnis, einfach für mich allein\nzu sein und einen Teil meines Tages ganz planlos zu verbringen. Letztendlich kommt das\nmeinem Mann und meinen Kindern zugute, denn so kann ich wieder Kraft für den Alltag\ntanken\nAlso, ich spiele leidenschaftlich Fußball. Aber seit ich studiere und arbeite, gehe ich immer\nseltener zum Training. Das ist schon schade, aber ich will mich nicht beschweren. Schließlich dauert so ein Aufbaustudium nicht ewig, und in einem Jahr hab ich’s ja geschafft.\nDann habe ich bessere Aufstiegschancen und hole das nach, was ich jetzt versäume. Dafür\nnehme ich die harte Zeit gerne in Kauf.\nBestimmt! Ich danke Ihnen beiden für Ihren Besuch bei uns im Studio. Ihnen, liebe Zuhörer, wünsche ich eine gute Zeit bis nächste Woche.\nTeil 4\nGuten Abend, verehrte Damen und Herren, ich freue mich, Sie zu meinem Vortrag „Richtiger Umgang mit\nPrüfungsangst“ begrüßen zu dürfen. Ich bin Dieter Brinkmann von der Uni Bielefeld.\nKennen Sie das Gefühl? Vor lauter Anspannung kann man nicht richtig lernen, und in der Semesterarbeit\nfällt einem nichts ein. Vor der mündlichen Prüfung ist der Kopf plötzlich leer, man bekommt Herzklopfen,\nzittrige Knie und feuchte Hände. So macht sich Prüfungsangst bemerkbar, und bis zu einem gewissen Grad\nist diese Unruhe verständlich, denn im schlimmsten Falle muss man das Semester wiederholen.\nWenn Ihnen diese Situation bekannt vorkommt, sind Sie nicht die Einzigen. Prüfungsangst ist ein weit\nverbreitetes Phänomen: Der eine fühlt sich unsicher und beklemmt vor Prüfungen, der andere bekommt\nkörperliche Beschwerden wie Durchfall oder Appetitverlust. Diese und ähnliche Symptome beeinträchtigen 58 Prozent aller Studentinnen und 35 Prozent aller Studenten bundesweit.\nDabei ist ein wenig Prüfungsstress angemessen und sogar wichtig, um Körper und Geist zur Höchstleistung\nzu bringen. Stress ist ja nichts weiter als eine Reaktion unseres Körpers auf eine äußere „Bedrohung“, die\nes schon unseren Vorfahren ermöglicht hat, auf Gefahrensituationen zu reagieren und somit zu überleben. In unserem Falle ist die „Gefahr“ die anstehende Prüfungssituation.\nWas aber viel schwerer wiegt, verehrtes Publikum, ist Folgendes: Das Ergebnis der Prüfung wird Ihr Selbstwertgefühl empfindlich treffen, wenn es von Ihrem Anspruchsniveau abweicht. Eine mittelmäßige Note\nlöst deshalb bei manchen Studierenden bereits Versagensgefühle aus. Angesichts dieser Bedrohung ist\nPrüfungsangst eine durchaus verständliche Reaktion.\nWenn aber ein bestimmtes Maß überschritten und aus der Unruhe Angst wird, die so stark ist, dass sie\nmich in meiner Leistungsfähigkeit beeinträchtigt oder sogar prüfungsunfähig macht, dann muss ich mir\ndarüber Gedanken machen, wie ich diese Angst auf ein angemessenes Niveau senken kann.\nGegen Prüfungsangst existiert zwar kein Patentrezept, dennoch können Sie mit der Situation und Ihren\nGefühlen aktiv umgehen und so Ihre Nervosität e iehung\nzum Menschen. Die Tiere wurden wohl im Boot von der nahen Festlandküste im Osten eingeführt,\ndenn auf der Mittelmeerinsel lebten sonst keine Wildkatzen.\nHÖRTEXT 1\nA: Manga sind schon lange nichts Ungewöhnliches mehr und längst in Deutschland angekommen – das\nmerkt man schnell, wenn man sich die Manga-Abteilungen in den großen Buchhandlungen ansieht:\ndie Verkaufszahlen gehen auch hierzulande in die Millionen.\nB: „Manga“ ist die japanische Bezeichnung für „Comic“. Allerdings gelten nur die Comics als Manga,\ndie tatsächlich aus Japan stammen. Typisch für den Manga-Stil sind die ziemlich großen Augen der\nComic-Figuren und auch die bunten Haare, wobei dies nicht ganz so oft vorkommt. Übrigens: Manga\nwerden nicht von vorne nach hinten gelesen, sondern genau umgekehrt.\nHÖRTEXT 2\nA: Ein neuer Bericht der Menschenrechtsorganisation Amnesty International schockiert: In vielen Smartphone- und Laptop-Batterien soll Kinderarbeit aus dem Kongo stecken; dort bauen teils 7-Jährige das\nMetall Kobalt in Minen ab.\nKobalt, ein unersetzliches Metall in den Lithium-Ionen-Akkus aller Mobilgeräte, stammt aus Minen\ndes afrikanischen Kongo, in denen, so schätzte das UNO-Kinderhilfswerk UNICEF 2014, rund 40.000\nMinderjährige beschäftigt sind.\nB: Amnesty fordert die Verbraucher auf, Druck auf die Hersteller auszuüben, damit die Kinderarbeit\naufhört. Millionen Menschen profitieren von den neuen Technologien, aber sie fragen nicht nach,\nwie sie produziert werden.\nHÖRTEXT 3\nA: Hallo, was ist denn mit dir los? Du siehst so unglücklich aus.\nB: Ich muss zum Zahnarzt, weil ich ein Loch im Zahn habe. Das macht mir ganz schön Angst.\nA: Also, das unwohle Gefühl vor dem Zahnarztbesuch kennt wohl jeder, denn angenehm sind die\nBehandlungen meistens wirklich nicht. Laut Statistik fürchtet sich ein Viertel der Patienten vor\ngroßen Eingriffen, während 19 Prozent generell bei jedem Zahnarzt-Besuch Angst empfinden.\nB: Das überrascht mich nicht!\nA: Es kann schon hilfreich sein, mit dem Arzt über die Angst zu sprechen.\nHÖRTEXT 4\n- 10 -\n© Praxis\nA: Studenten beherrschen Grammatik und Rechtschreibung nicht, klagen Dozenten der Schweizer\nUniversitäten. Trotzdem legen aber die Lehrpersonen den Schwerpunkt vermehrt auf den Inhalt denn\nauf Formfehler. Ist das richtig so?\nDas Niveau der Studierenden sei zum Teil erschreckend, sagt Peter Kunz von der Rechtswissenschaftlichen Fakultät der Universität Bern. Er meint damit nicht etwa das juristische Wissen der Studierenden, sondern deren orthographische Kompetenzen.\nEine Erhebung der Universität Zürich gibt Kunz recht: Zwei von drei befragten Lehrern geben an, dass\nGymnasiasten mehr Fehler machen als noch vor zehn Jahren.\nHÖRTEXT 5\nA: Wussten Sie schon? Der Grönlandhai oder Eishai kann mindestens 400 Jahre alt werden! Damit sind\ndie Haie nach bisherigen Erkenntnissen die langlebigsten Wirbeltiere der Welt.\nDiese Haienart lebt im Nordatlantik und Nordpolarmeer und wächst nur etwa einen Zentimeter pro\nJahr. Was das Geheimnis ihres hohen Alters ist, weiß man bislang nicht genau. Vermutlich ist das\nlangsame Wachstum nicht der einzige Grund.\nB: Der Grönlandhai lebt damit noch deutlich länger als der Grönlandwal, der älter als 200 Jahre werden\nkann und bisher als Rekordhalter unter den Wirbeltieren galt.\nTeil 2\n© Praxis\nModeratorin: Zum Auftakt der Frankfurter Buchmesse begrüßen wir heute im Studio Frau Doktor Schwenk.\nFrau Schwenk ist Medienwissenschaftlerin und Direktorin der Stadtbücherei Heidelberg.\nSchwenk:\nGuten Morgen.\nModeratorin: Doktor Schwenk, im digitalen Zeitalter fragt man sich unweigerlich: Wer liest überhaupt\nnoch in dieser Welt, die stark von Schnelllebigkeit und Zeitdruck geprägt ist? Ist Bücherlesen heutzutage nicht einfach altmodisch?\nSchwenk:\nSo kann man das nicht sagen. Lesen erfreut sich zunehmender Beliebtheit. Zwar sinken\nseit einigen Jahren die Ausleihzahlen bei gedruckten Büchern, gleichzeitig kommen aber\nimmer mehr Menschen in die Bibliotheken. Denn oft sind sie der einzige öffentliche Raum\neiner Stadt, wo man keinen Eintritt zahlen muss und sich in angenehmer Umgebung aufhalten kann. Dazu tragen auch immer wieder besondere Veranstaltungen bei, wie erst\nkürzlich die „Nacht der Bibliotheken“. Die ganz besondere Atmosphäre des Abends und\nder Dunkelheit zieht vor allem junge Leser an.\nModeratorin: Welche sind denn die beliebtesten Lesestoffe?\nSchwenk:\nBesonders gefragt sind Krimis, Fantasyliteratur sowie Bestseller. Dabei spielt das Alter\neine untergeordnete Rolle: Ältere wollen mit den aktuellen Bestsellern am Puls der Zeit\nbleiben so wie Jüngere immer mal wieder einen Klassiker lesen. Auch Hörbücher werden\ngerne und viel ausgeliehen. Wir haben immer zu wenig davon. Viele leihen sie sich für\nlängere Autofahrten aus oder lassen sich beim Bügeln und Abwaschen vorlesen.\nModeratorin: Kommt man denn heute überhaupt noch zum Lesen?\nSchwenk:\nEiner Studie zufolge haben die Menschen heute insgesamt mehr Zeit für Freizeitaktivitäten. Diese ist in den vergangenen Jahren auf etwa sechs Stunden täglich gestiegen, von\ndenen im Schnitt 65 Minuten dem Lesen von Zeitungen, Zeitschriften und auch Büchern\ngewidmet werden. Damit hat der Zeitaufwand fürs Lesen seit der vorherigen Studie um\nzwölf Prozent zugenommen.\nModeratorin: Wie machen sich denn die Bibliotheken fit für das digitale Zeitalter?\nSchwenk:\nAuch wenn das Buch noch lange nicht ausgedient hat, steht doch eines fest: Die Art und\nWeise, wie eine Bücherei genutzt wird, hat sich verschoben – nicht zuletzt auch durch\ndas Internet. Aber wir haben reagiert: Wir verleihen beispielsweise E-Book-Reader und\nberaten die Nutzer. Die elektronischen Bücher, Zeitungen und Zeitschriften bieten gerade\nMenschen mit eingeschränktem Sehvermögen erhebliche Vorteile, weil sie die Schriftgröße einstellen können.\nModeratorin: Trotzdem blättert man immer noch gerne in gedruckten Zeitungen und Büchern. Wieso?\nSchwenk:\nGanz einfach: sie fühlen sich besser an. Und: Bücher duften einfach wunderbar. Außerdem sind sie oft liebevoll gestaltet. Einige Verlage machen aus dem Buchumschlag ein\nkleines Kunstwerk. Ebenfalls wurde festgestellt, dass die Lektüre auf Papier das Verständnis der Texte erleichtert.\nModeratorin: Und wie sieht die Zukunft für die Büchereien aus?\nSchwenk:\nIn den USA gibt es seit einigen Jahren eine bücherlose Bibliothek. Statt Büchern stehen\nPCs, Laptops und Tablets in den Räumen bereit, darunter auch 50 spezielle e-Reader\nfür Kinder. Ausleihen kann man dann 100 aufgeladene e-Reader. Man versucht also,\ndie Bibliothek kundengeeignet und nicht die Kunden bibliothekgeeignet zu machen.\nModeratorin: Wie interessant! Ich bin gespannt, ob sich dieser Trend auch in Deutschland durchsetzt.\nHerzlichen Dank, Frau Doktor Schwenk, für dieses aufschlussreiche Gespräch.\nSchwenk:\nGerne.\n- 11 -\nTeil 3\n- 12 -\n© Praxis\nModeratorin: Willkommen bei „Studio Eins am Abend“. Liebe Zuhörerinnen und Zuhörer, es ist wieder\nsoweit: In vier Wochen ist Weihnachten, und wie jedes Jahr stürmen die Österreicher\nwieder die Kaufhäuser, um Geschenke zu kaufen und damit die Liebsten glücklich zu\nmachen. Aus diesem Grund wollen wir heute der Frage nachgehen: „Weihnachten – Fest\nder Liebe oder doch des Konsumterrors?“\nAls ersten Gast begrüße ich im Studio Lukas Winkler. Er berät Menschen, die unter Kaufzwang leiden.\nPsychologe: Guten Tag.\nModeratorin: Herr Winkler, Sie haben derzeit Hochsaison, wenn ich das mal so sagen darf.\nPsychologe: Stimmt. Gerade zu Weihnachten sind Versuchung und innerer Zwang groß – und äußern\nsich oft in übertrieben teuren Geschenken, die unseren Geldbeutel bei weitem überfordern.\nModeratorin: Vielleicht können Sie uns heute den einen oder anderen Tipp geben, damit wir am\nEnde des Monats nicht vor einem Schuldenberg stehen. Außerdem begrüße ich im Studio\nSophie Gruber. Sie ist 16, Schülerin am Gymnasium und wünscht sich dieses Jahr etwas\nganz Besonderes, nämlich – nichts!\nSchülerin:\nGenau! Hallo. Nennen Sie mich bitte einfach Sophie.\nModeratorin: Gerne, Sophie! Herzlich willkommen. Meine erste Frage geht an Sie, Herr Winkler: Warum\ndreht sich gerade in der Zeit vor Weihnachten für viele alles ums Einkaufen?\nPsychologe: Ganz einfach: weil es Spaß macht. Schenken macht in erster Linie uns selbst glücklich,\nda sollte man sich nichts vormachen. Viele von Ihnen werden das Gefühl der Freude\nkennen, wenn Sie für liebe Personen genau das richtige Geschenk getroffen haben. Deshalb\nspendet man beispielsweise auch gern.\nModeratorin: Dabei ist die Begeisterung für das Schenken keine Sache des Vermögens. Einer Umfrage\nzufolge freuen sich die meisten Menschen, wenn sie spüren: die Person hat sich Gedanken darüber gemacht, was mir gefallen könnte. Vielen ist es sogar unangenehm, teure\nGeschenke zu bekommen, weil sie sich verpflichtet fühlen, ähnlich großzügig zu schenken.\nMeine nächste Frage geht an Sie, Sophie: Wie schenken Sie denn zu Weihnachten?\nSchülerin:\nAlso, normalerweise schenke ich persönlich nie etwas, was mir nicht selbst ausgesprochen gut gefällt. Das muss auch nicht gekauft sein: ich verschenke oft selbstgemachtes\nWeihnachtsgebäck, getrocknete Kräuter oder gebastelte Kleinigkeiten.\nModeratorin: Sie beschenken ihre Mitmenschen gern, Sophie, aber Sie selbst wünschen sich zu Weihnachten nichts. Wie kommt das?\nSchülerin:\nJa. Also, meine Eltern haben mich schon gefragt, was ich mir wünsche, und ich wusste gar\nnicht, was ich sagen sollte. Ich finde, ich habe alles, was ich haben möchte.\nModeratorin: Da sind Sie unter Ihren Altersgenossen sicher eine Ausnahme. Ich persönlich kenne\nkeine Teenager, die zur Weihnachtszeit nicht mindestens von einem Smartphone, einem\nTablet-PC oder Klamotten träumen.\nSchülerin:\nDass ich mir gar nichts zu Weihnachten wünsche, stimmt nicht ganz. Ich wünsche mir\nnur nichts für mich. Stattdessen wünsche ich mir, dass Familien in Österreich unterstützt\nwerden, die in Armut leben. Selbst wenn ich die Welt damit nur ein Stückchen besser\nmache, ist es einfach schön, sich wieder daran zu erinnern, was der eigentliche Sinn von\nWeihnachten ist und dass Konsum schöne, neue Sachen und Geld nicht alles sind.\nModeratorin: Damit machen Sie den Not leidenden Familien sicher eine große Freude. Herr Winkler, ein\nabschließender Kommentar?\nPsychologe: Gute Organisation hilft dabei, dem Einkaufsstress und dem übertriebenen Konsum der\nVorweihnachtszeit zu entkommen. Geschenkideen kann man problemlos das ganze Jahr\nüber notieren und im November besorgen. Das hilft nicht nur den Kaufsüchtigen: Ich halte\nmich auch an dieses Prinzip.\nModeratorin: Sophie, Herr Winkler, ich danke Ihnen beiden für dieses Gespräch und wünsche unseren\nZuhörern eine frohe und stressfreie Vorweihnachtszeit.\nTeil 4\nGuten Abend, verehrte Damen und Herren, und herzlich willkommen zu meinem Vortrag „Konflikte in der\nFamilie“. Ich bin Thomas Lindner und arbeite am Institut für Familientherapie in Schwabing.\nAngeblich lebt irgendwo in München eine Familie, in der noch nie ein böses Wort gefallen ist (lacht). Nein,\nim Ernst: In allen Familien gibt es Konflikte. Streiten ist also völlig normal. Streiten ist wichtig und richtig,\num sich als Familie weiter zu entwickeln. Das war schon immer so und wird so bleiben.\nKonfliktstoff bietet allein der Alltag genug. Überall dort, wo es unterschiedliche Meinungen und Haltungen\ngibt, wird diskutiert und zuweilen heftig gestritten. Streiten ist unvermeidbar und gehört zum Leben. Und\nwenn in einem Betrieb von familiärer Atmosphäre die Rede ist, dann ist unweigerlich damit auch gemeint,\ndass es auch Meinungsverschiedenheiten wie in einer Familie gibt.\nAlle, die schon ältere Kinder haben, wissen, dass das Familienleben zum großen Teil von den Entwicklungsschritten der Kinder geprägt ist. Jede Entwicklungsstufe birgt unterschiedliche Konfliktstoffe, denn Kinder\ntesten immer, wie weit sie gehen können. Insbesondere die Pubertät, in der die Jugendlichen sich von den\nEltern lösen und nicht selten über die Stränge schlagen, ist für beide Seiten, Eltern und Kinder, eine große\nSchule. Jugendliche reizen die Grenzen der Eltern oft bis zum Letzten aus.\nAuch unter Geschwistern entbrennen nicht selten die heftigsten Konflikte. Die Familie ist der erste Platz\nim Leben, an dem Kinder lernen mit anderen Menschen umzugehen und mit ihnen auszukommen. Sie\nkönnen im Streit miteinander viel erfahren: die eigenen Bedürfnisse durchzusetzen und sich abzugrenzen,\naber auch die Wünsche anderer zu respektieren, mit Niederlagen klar zu kommen und Kompromisse zu\nschließen.\nAndererseits halten Geschwister oft zusammen wie Pech und Schwefel, vor allem, wenn es darum geht,\neigene Interessen gegenüber den Eltern zu vertreten. Das Band, das Brüder und Schwestern miteinander\nverbindet, ist das stärkste, was es gibt, wie ja die antiken Dramen uns lehren.\nNicht zuletzt kommt es zu Streitereien der Eltern untereinander oder über unterschiedliche Erziehungsstile. Können Kinder vom Streit ihrer Eltern aber auch profitieren? Ihre Kinder können von Ihnen lernen,\ndass zwei Menschen, die sich gegenseitig wertschätzen, auch durchaus einmal richtig aneinander geraten\nkönnen und sich hinterher wieder gut vertragen. Das Beispiel, das Sie Ihren Kindern in Streitsituationen\ngeben, kann für sie später eine Vorbildfunktion einnehmen.\nEs ist erwiesen, dass zum Beispiel Aggressivität, die vor den eigenen Kindern ausgetragen wird, später\nderen Gewaltbereitschaft fördert. Deshalb sollten Sie sich sehr bemühen, Ihren Kindern auch beim\nStreiten ein gutes Vorbild zu sein. Dass dies ganz einfach ist, wird keiner behaupten. Aber man kann es\ndurchaus lernen.\nAuch im Konfliktfall sind Eltern also Vorbild. Kinder sehen, wie die Eltern miteinander streiten. In der\nFamilie können sie am besten lernen, dass zwei Menschen, die einander wertschätzen, auch einmal\naneinander geraten können und sich hinterher wieder gut verstehen.\nHerzlichen Dank für Ihre Aufmerksamkeit, meine Damen und Herren.\n© Praxis\n- 13 -","S":"SCHREIBEN (Lehrbuch, OCR)\n<eschreiben einen Forumsbeitrag zum Th\nwe hema ,Erholung vom\nstressigen Alltag”\nNennen Sie Gründe, warum der Alltag heutzutage so\nNennen sie mopliche gesundheitliche Folgen von $i aa\ncanrste res\nSchlagen Sie vor, wie man sich vom belastenden Allt :\nAuRern Sie sich zur Entwicklung der Situation in ioe\nwakuni\npenken Sie an eine Einleitung und einen S\nchluss, Bei der B\nI tspunkte bea ewerung\nrialtspunkte bearbeitet sind, wie korrekt der Text ist und wie a wi ers ea wie genau die\ni und Abschnitte sprachlich :\nmite\njinander verknipft sind. Schreiben Sie mindestens 150 Worter.\nTeil 2\nX Aufgabe\nSie und ihre Fi 7\nihre Familie emeil vor Informationen erhi\nlie wollen gemeinsam Urlaub machen und machten zuvo Informationen erhalten. 2u\ndiesem 2 ;\n\"weck schreiben Sie eine E-Mail an ein Reiseburo.\nschreiben Sie, wee\ncy rie lange si UCI =\n\\ pitten sie ure einer jr a mi\n“rereain far 18 POSEN acm woe\nach. ‘\n“Aufern Sie Winsche 24\nches BeratungsgesP\n— — j unterkunft und Verpflegung:\n‘spunkte. Bei der Bewertung wird darauf geachtet,\nt der Text ist und wie gut die Satze und Abschnitte\nworter. :\nOberte\n'9eN Sie eit\nWie genay ae te passende Reihenfolge fir die Inhalt:\nSprachlich Sepa bearbeitet sind, wie korrek!\ninander verknüpft sind. Schreiben Sie mindestens 100","P":"SPRECHEN (Lehrbuch, OCR)\nSPRECHEN:\nTeil 1\n\\ auigabe\ni len dort einen kurzen Vortrag halten.\nnehmen an einem Seminar teil und soll i ortrag\nwaihten Sie ein Thema (A oder B) aus. thre) Gespröchspartner(in) hGrt zu und stellt thnen ansehy\nae cra lef\nFragen. Strokturieren Sie thren Varteag mit einer Einleitung, einem Houptteil und einem Schluss, ihre, jis\nund Ideen schreiben Sie bitte in der Vorbereitungszeit\nauf. Sprechen Sie ca. 4 Minuten.\nTeiInehmende/-r A\nGrostadtverkehr\n* Beschreiben Sie die heutige Situation.\n* Nennen Sie Alternativen zur Entlastung\ndes Autoverkehrs.\n‘= Nennen Sie Vor- und Nachteile und beg rkerem Druck, wie aus der\nRangliste der Pressefreiheit hervorgeht. In den USA, in Polen oder Großbritannien äußerten Politiker öffentlich ihre Geringschätzung für Journalisten. Deutschland behauptete sich auf Platz 16 der Rangliste.\nA: Die UN-Generalversammlung erklärte 1993 den 3. Mai auf Vorschlag der UNESCO zum Welttag der\nPressefreiheit.\nHÖRTEXT 2\nA: Sie kennen vielleicht das Hochgefühl, das sich bei Langstrecken- oder Marathonläufern nach einiger\nZeit einstellt. Doch Laufen kann noch mehr - Sie müssen noch nicht einmal dabei rennen. Ein simpler\nSpaziergang hilft schon dabei, nicht nur fit zu bleiben, sondern auch schlau. Voraussetzung: Er sollte\nfester Bestandteil Ihres Alltags sein.\nB: Ständiges Sitzen kann das Risiko, an Alzheimer zu erkranken, deutlich erhöhen. Umgekehrt konnten\nmehrere Versuche zeigen, dass regelmäßige Bewegung die Hirn-aktivität anregt und die Konzentration\nsteigert.\nA: Worauf also noch warten? Gehen Sie einfach öfter spazieren - zum Beispiel jetzt. Und sei es nur eine\nRunde um den Block.\nHÖRTEXT 3\nA: Der Kult-Roller Vespa wird elektrisch. Die Vespa Elettrica wurde auf der Motorradmesse in Mailand\npräsentiert und soll das Unternehmen Piaggio ins Zeitalter der Elektromoblität hinüberhelfen. Die\nElettrica sieht aus wie eine Original-Vespa, allerdings befindet sich der Elektroantrieb am Hinterrad.\nDas Besondere: Sie fährt vollkommen geräuschlos.\nB: Von der Original-Vespa wurden in mehr als 70 Jahren 18 Millionen Stück verkauft. Doch den Trend\nzum Elektromotor hatte das Unternehmen lange Zeit ignoriert. Nun kommt zu den sieben herkömmlichen Modellen noch die E-Vespa dazu. Der Marktstart ist für Ende des Jahres geplant.\nHÖRTEXT 4\n- 14 -\n© Praxis\nA: Hallo Tina! Na, hast du dein Bewerbungsschreiben schon abgeschickt?\nB: Du meinst das für die spannendste Start-up-Idee des Jahres? Klar, wie immer! Der Wettbewerb läuft\nja nur bis Ende Juli.\nA: Und was kann man nochmal dabei gewinnen?\nB: Der Gewinner erhält drei Jahre lang  ihnen\nnicht nur, sondern sie seien ein Teil ihrer Persönlichkeit. So ist ein Kleinkind der Meinung,\nder Teddy in seinem Arm gehöre untrennbar zu ihm. Nimmt ihm jemand den Teddy weg,\nfühlt sich das Kind selbst bedroht.\nAlso müssen die Kinder Teilen erst lernen. Welches sind denn die Voraussetzungen?\nUm freiwillig einem anderen etwas von seinem Besitz abzugeben, muss sich das Kind\nvorstellen können, wie sich sein Gegenüber fühlt. Ist er traurig, weil er das Spielzeug\nnicht haben kann? Erst wenn Kinder ein Gespür dafür entwickeln, was in einem anderen\nvorgeht, können sie mitfühlend handeln und z.B. freiwillig etwas abgeben. Das zum Teilen\nnötige Einfühlungsvermögen entwickelt sich jedoch frühestens ab einem Alter von drei\nJahren. Mit dem Charakter des Kindes an sich hat es nur wenig zu tun.\nAber auch als Erwachsene teilen wir nicht gleich gern. Welche anderen Faktoren spielen\ndenn eine Rolle?\nZugegeben, freigiebig zu teilen oder Dinge zu verleihen, ist nicht nur eine Frage des sozialen Trainings, sondern auch der Persönlichkeit – der eine ist eben großzügiger, während\nder andere sein Eigentum gar nicht gern teilt. Ich stelle aber immer wieder fest, es kommt\nauch auf die frühkindlichen Erfahrungen an. So sind diejenigen Kinder meist großzügiger,\ndie von ihren Eltern immer das bekamen, was sie gerade brauchten. Wer immer genug\nhatte, tut sich mit dem Teilen später meist leichter.\nKann man denn ein Kind zum Teilen zwingen?\nGanz klar: Wenn sich zwei kleine Kinder um ein Spielzeug streiten, ist es die denkbar\nschlechteste Lösung, wenn Sie Ihr Kind zum Teilen zwingen wollen. Dann wird es seinen\nBesitz zukünftig nur umso stärker verteidigen. Auch gilt es als erwiesen, dass die Aussicht auf eine Belohnung Kinder nicht nachhaltig zum Abgeben und Verleihen motiviert.\nSobald die Belohnung mal ausbleibt, ist die Bereitschaft zum Teilen auch schnell wieder\nverschwunden.\nWelchen Ratschlag geben Sie in diesem Falle den Eltern?\nSie sollten erst einmal abwarten, ob die Kinder nicht selbst zu einer Lösung kommen. Will\nIhr Kind mit einem Spielzeug eines anderen Kindes spielen, so muss es vorher fragen, ob\nes dieses Spielzeug haben darf. Und es muss gegebenenfalls ein Nein akzeptieren, wenn\nder Besitzer es nicht teilen will – auch wenn es schwerfällt. Doch das ist Übungssache.\nHerzlichen Dank, Frau Doktor Bertold, für dieses interessante Gespräch.\nGerne.\n© Praxis\n- 15 -\nTeil 3\nModerator:\nAngestellte:\nModerator:\nStudent:\nModerator:\nAngestellte:\nModerator:\nAngestellte:\nModerator:\nStudent:\nModerator:\nStudent:\nModerator:\nAngestellte:\nStudent:\n- 16 -\n© Praxis\nModerator:\nWillkommen beim Webradio Freiburg. Das Thema heute: Mobilität im Pendler-Alltag.\nWelche Verkehrsmittel nutzen Berufstätige und Studierende, die täglich weite Strecken\nzurücklegen? Und: Wieso zieht man nicht einfach in die Nähe der Arbeitsstelle oder der\nUni? Mein erster Gast im Studio ist Eva Müller. Sie pendelt täglich über die deutsche Grenze in die Schweiz zu ihrem Arbeitsplatz und zurück.\nJa, guten Tag.\nAußerdem begrüße ich im Studio Herrn Stefan Wagner. Er studiert an der Uni Freiburg\nJournalistik im sechsten Semester und wohnt im 60 Kilometer entfernten Offenburg bei\nseinen Eltern.\nHallo.\nMeine erste Frage geht an Sie, Frau Müller: Sie wohnen in Waldshut, nahe an der Grenze\nzur Schweiz. Wie kommen Sie täglich zur Arbeit?\nAlso, ich fahre jeden Tag mit dem Zug eine Stunde nach Zürich. Bis ich an meinem Arbeitsplatz ankomme, dauert das ungefähr nochmal eine Stunde. Mit dem Auto ginge es schon\nschneller, aber dafür komme ich entspannter an.\nDa haben Sie Glück, denn viele Pendler klagen über verspätete Züge, lange Wartezeiten\nbeim Umsteigen, überfüllte Busse und Trams. Aus diesem Grund bleibt das Auto für sie\nmit Abstand das wichtigste Verkehrsmittel auf dem Weg zur Arbeit.\nFrüher bin ich auch mit dem Auto gefahren, aber das lag eher daran, dass wir auf dem\nLand gewohnt haben und die Busverbindungen in die Stadt sehr schlecht waren. Da gab es\nkeine Alternative zum Auto. Aber das war nichts für mich, denn als Autofahrer muss man\nsich auf der Straße permanent konzentrieren. Wenn ich dann noch in einen Stau geriet,\nwar ich schon bei der Ankunft am Arbeitsplatz erschöpft.\nHerr Wagner, auch Sie pendeln täglich von Offenburg nach Freiburg. Wie lange dauert\ndenn Ihr Weg?\nVon mir zu Hause bis zur Uni brauche ich circa fünfzig Minuten. An den meisten Tagen\ngehe ich morgens etwa um halb acht aus dem Haus, freitags etwas später.\nVon Offenburg nach Freiburg ist es ja nun nicht so weit, aber dennoch meine Frage: Wieso\nhaben Sie sich nicht dazu entschlossen, als Student in Freiburg zu wohnen?\nEigentlich wollte ich schon seit Jahren nach Freiburg ziehen, aber in der Innenstadt lässt\nsich nichts Passendes finden. Da dachte ich mir: Wenn ich schon nichts Bezahlbares in den\nzentral gelegenen Stadtteilen Freiburgs finde, kann ich genauso gut in Offenburg bei meinen Eltern bleiben. Dann spare ich darüber hinaus die Kosten für die Wohngemeinschaft\nund gebe mein Geld für andere Dinge aus.\nFragt man Pendler, womit sie sich während ihrer täglichen Hin- und Rückfahrten die Zeit\nvertreiben, dann antworten die meisten, dass sie Zeitung lesen, in einem Buch schmökern, auf dem Laptop Texte schreiben oder vielleicht sogar eine Fremdsprache lernen.\nWie verbringen Sie die Zeit?\nIch mache gerne Handarbeiten. Im Moment stricke ich gerade einen Winterpullover für\nmeinen Neffen. Das entspannt und ich betätige mich kreativ.\nIch hab mal versucht, mein Französisch zu verbessern, aber im Zug zu lernen klappt bei mir\nnicht. Ich bin eher ein kommunikativer Mensch und unterhalte mich gern auf der Fahrt.\nSo habe ich übrigens auch meine Freundin kennengelernt. Wir haben beide auf einen Zug\ngewartet, der einfach nicht gekommen ist. Da blieb genug Zeit, sich zu unterhalten.\nNoch ein Vorteil des Pendelns (lacht). Frau Müller, Herr Wagner, ich danke Ihnen vielmals\nfür dieses Gespräch. Liebe Zuhörer, tschüs bis nächste Woche.\nTeil 4\nSehr geehrte Damen und Herren, im Rahmen der Veranstaltungsreihe über Ernährung, Entspannung und\nFitness begrüße ich Sie zu meinem Vortrag „Gesundheit und bessere Lebensqualität im Alter“. Mein Name\nist Volker Brink und ich bin Sportwissenschaftler an der Sporthochschule Köln.\nDie Zeiten, in denen älteren Menschen ausschließlich zu lockerer Ausdauerbelastung geraten wurde, sind\nvorbei. Stattdessen rückt die Bedeutung von regelmäßigem Training auch in höherem Alter in den Fokus.\nWer dem Pflegeheim entrinnen möchte, sollte sich ins Fitnessstudio begeben.\nStudien belegen, dass bereits ab einem Alter von 30 Jahren die Muskulatur des Körpers schwächer wird.\nAb 60 verliert der Mensch sogar gut ein Prozent seiner Muskelkraft pro Jahr. Aber das hängt nicht, wie\ndie meisten unter Ihnen wohl annehmen, ausschließlich mit dem Alter zusammen, das muss man ganz\nklar sagen.\nDer Muskelschwund ist ausschließlich dadurch bedingt, dass der Organismus nicht mehr ausreichend\nstimuliert wird. Das bedeutet also, es ist nicht unvermeidlich, dass wir im Alter immer schlechter in der\nLeistungsfähigkeit werden – nein, das hängt nur mit der Nutzung des Körpers zusammen.\nIch bin davon überzeugt, dass Training, um den Kraftverlust aufzuhalten, für jeden Menschen wichtig\nist. Muskelaufbautraining ist, verehrtes Publikum, der sicherste Schutz vor dem Pflegeheim. Doch damit\nfangen die meisten, wenn überhaupt, erst dann an, wenn gesundheitliche Probleme auftreten.\nWichtig ist dabei regelmäßig zu trainieren, um die Leistungsfähigkeit zu verbessern. Da helfen schon ganz\neinfache Übungen, zwei- bis dreimal die Woche, zur Muskelkräftigung, bei Männern auch zur Muskeldehnung. Es ist außerordentlich wirkungsvoll und hält letztendlich den gesamten Körper jung. Darüber hinaus\nwird die Durchblutung des Gehirns verbessert, was zum Beispiel Depressionen vorbeugen kann.\nZum anderen ist es aber auch von Bedeutung, die Belastung in kleinen Schritten zu steigern und nicht\nschon beim ersten Mal schwere Gewichte zu heben: Lassen Sie sich dabei von geschultem Personal oder\neinem Physiotherapeuten beraten. Werden diese Prinzipien beherzigt, ist ein Muskeltraining bis ins hohe\nAlter problemlos möglich und es wird eine ganz neue Lebensqualität entwickelt.\nNicht zuletzt erhöhen auch Entspannung und Stressbewältigung unsere Lebensqualität. Die Ursache\nfür Stress ist in den meisten Fällen nicht eine belastende Situation selbst, sondern die Angst vor dieser\nSituation. Es ist die Angst, den Arbeitsplatz zu verlieren, einen Verkehrsunfall zu haben. Es ist die Angst um\ndas eigene Leben, die den Menschen zu schaffen macht.\nSo entsteht Dauerstress, gegen den etwas getan werden muss. Am besten wäre sicher immer eine direkte\nLösung des Problems. Doch falls das Problem in naher Zukunft nicht gelöst werden kann, hilft eine Sache\nimmer: „Laufen Sie!“ Das ist eines der besten Mittel, um Stress zu bewältigen.\nMeine Damen und Herren, ich danke Ihnen für Ihre Aufmerksamkeit.\n© Praxis\n- 17 -","S":"SCHREIBEN (Lehrbuch, OCR)\n..... WERKSTATT B2 f\nteil\n\\ autgabe\nsie schreiben einen Forumsbeitrag Über den Erfolg im Beruf und die sogenannte\n+ Außern Sie Ihre Meinung zur Bedeutung des Erfolgs im Beruf,\n+ Nennen Sie Faktoren, die den beruflichen Aufstieg beeinflussen\n»große Karriere”.\n+ Nennen Sie Möglichkeiten, wie der Erfolg im Beruf sichergestellt werden kann. 2\n+ Beschreiben Sie, welche Rolle die Konkurrenz zwischen Mitarbeitern spielt,\nenken Sie an eine Einleitung und einen Schluss. Bei der Bewertun\nInhaltspunkte bearbeitet sind, wie korrekt der Text ist und wie gi\nmiteinonder verknüpft sind. Schreiben Sie mindestens 150 Worter,\n9 wird darauf geachtet, wie genau die\njut die Sötze und Abschnitte sprachlich\nTeil 2\n\\ Aufgabe\nBie Abteilung der Firma ,Ger', in der Sie seit Jahren arbeiten, feiert gemeinsam mit allen Mitarbeitern den\nfibestond von Frau Lester, die sehr lange mit Ihnen zusammen gearbeitet hat. Sie haben da eini ungen für diesen absehbaren Engpass.\nVielversprechend scheint „Indoor Farming“, das heißt urbane Landwirtschaft in vertikalen Gewächshäusern. Damit ließe sich an jedem Ort der Welt Gemüse produzieren, platzsparend und unabhängig\nvom Klima. In den USA gilt das Modell vielen sogar als Agrarwirtschaft der Zukunft.\nHÖRTEXT 2\nA: Die duale Berufsausbildung verknüpft Praxis und Theorie miteinander. Praktische Fertigkeiten\nerwerben Sie im Ausbildungsbetrieb, theoretisches Wissen an der Berufsschule. Im Schnitt verbringen\nSie rund 70 Prozent der Ausbildungszeit im Betrieb und 30 Prozent in der Berufsschule. Damit ist die\nduale Ausbildung sehr praxisorientiert – insbesondere im Vergleich zu einem Studium. Nach mindestens zwei bis maximal dreieinhalb Jahren beenden Sie die Ausbildung mit einer Abschlussprüfung in\nmündlicher und schriftlicher Form – und haben damit eine gründliche berufliche Kompetenz erworben.\nHÖRTEXT 3\nA: Die vier Millionenstädte Paris, Mexiko-Stadt, Madrid und Athen wollen ihre Luftqualität verbessern\nund in einigen Jahren Dieselautos aus ihrem Verkehr verbannen. Zudem sollen alternative Verkehrsmittel sowie der Fuß- und Fahrradverkehr gefördert werden, geht aus einer Mitteilung hervor.\nB: Die Bürgermeister dieser Megastädte rufen die Pkw- und Bushersteller zu Kooperation auf. Sie sollten\nin ihre Fahrzeuge keine Dieselmotoren mehr einbauen, sondern auf elektrische oder hybride Fahrzeuge setzen, um Verkehrswege und Lungen zu entlasten.\nA: Die Weltgesundheitsorganisation WHO schätzt, dass jährlich 3 Millionen Menschen in Folge der Luftverschmutzung in den Städten sterben.\nHÖRTEXT 4\n- 18 -\n© Praxis\nA: Warum ins Theater? Warum sollten wir denn immer nur ins Kino gehen? Das ist doch langweilig.\nDas Theater nimmt uns mit in eine andere Welt: dort gibt es keine Grenze zwischen dem Publikum\nund dem Geschehen. Es findet vor unseren Augen statt, ist lebendig. Das Stück, die Schauspieler\nund die Kulisse fordern unsere Aufmerksamkeit.\nB: Nach einem Kinofilm bin ich oft müde und schlecht gelaunt. Das Sonnenlicht blendet, wenn ich\nwieder auf die Straße gehe. Aber das Theater belebt mich, ich kann nicht genug davon kriegen.\nHÖRTEXT 5\nA: Frühaufsteher gelten in Deutschland als leistungsstarke Menschen. Die meisten stehen morgens um\n06.00 Uhr auf. Viel zu früh, sagen die Schlafforscher. Denn vor neun Uhr können die Millionen von\nArbeitnehmern kaum etwas Vernünftiges leisten.\nB: Schlafforscher auf der ganzen Welt betonen seit Jahren, wie dringend unser Organismus seinen Schlaf\nbraucht. Schon ein bis zwei Stunden zu wenig können die Hirnfunktionen dramatisch einschränken.\nMan arbeitet langsamer, schlechter und muss früher oder später damit rechnen, krank zu werden.\nFehlende Nachtruhe verursacht also nicht nur Ringe unter den Augen, sie führt auch zum Stresssyndrom.\nTeil 2\nModerator:\nBeckmann:\nModerator:\nBeckmann:\nModerator:\nBeckmann:\nModerator:\nBeckmann:\nModerator:\nBeckmann:\nModerator:\nBeckmann:\nModerator:\nBeckmann:\nIm Studio begrüße ich heute Herrn Doktor Beckmann, Arbeitsmarktexperten und Studienberater bei der Bundesagentur für Arbeit. Doktor Beckmann, gleich meine erste Frage:\nSollte man bei der Wahl des Studiums vor allem auf gute Jobaussichten achten?\nEs wird häufig der Eindruck erweckt, man müsse vor allem etwas studieren, was Zukunft\nhat und einen sicheren Job bringt. An erster Stelle sollten jedoch immer die eigenen\nInteressen und Neigungen stehen. Danach ist es natürlich sinnvoll, von Anfang an die\ntatsächlichen beruflichen Anforderungen und – so weit möglich – auch die künftigen\nBerufsaussichten in seine Überlegungen mit einzubeziehen.\nIst es nicht vernünftiger, sich zuerst den Arbeitsmarkt anzuschauen?\nNein, denn in einem Beruf, der gute Chancen bietet, einem aber nicht liegt, ist man\nweniger bereit, sich weiterzubilden, flexibel zu sein – das sind aber alles wichtige Faktoren,\ndie über den Erfolg am Arbeitsmarkt mitentscheiden. Ich empfehle daher, einen Beruf zu\nwählen, bei dem man auch mit dem Herzen dabei ist. In jeder Branche werden Fachkräfte\ngebraucht, in jedem Beruf gibt es Nachwuchsbedarf, man hat also überall Chancen.\nAber die sind ungleich verteilt. Es gibt zum Beispiel kaum Arbeitsplätze für Literaturwissenschaftler oder Kulturwissenschaftler. Sind die Absolventen dann arbeitslos?\nNein, das ist selten der Fall. Sie brauchen aber oft länger, um einen Job zu finden, und\nnur bei zwei von drei Absolventen hat die Arbeit inhaltlich etwas mit dem zu tun, was sie\nstudiert haben. Das muss aber nicht unbedingt schlecht sein, wenn die Stelle anspruchsvoll ist und entsprechend bezahlt wird. Die meisten schaffen es im Laufe der Zeit, dieses\nZiel zu erreichen.\nWelche Fächer werden besonders gefragt sein, wenn die Studienanfänger von heute\nfertig sind?\nWelche Berufe künftig begehrt sein werden ist kaum vorauszusehen. Deshalb geben\nwir von der Bundesagentur für Arbeit keine Prognosen ab. Aber natürlich können wir\nsagen, wo im Moment Leute gesucht werden. Wir sehen zurzeit überdurchschnittlich gute\nArbeitsmarktchancen für Informatiker und Ingenieure. Auch Ärzte, Wirtschaftsfachleute\nund Sozialarbeiter und -pädagogen werden stark nachgefragt.\nLohnt sich ein Studium eigentlich finanziell?\nHochschulabsolventen verdienen im Laufe ihres Berufslebens wesentlich mehr als\nFacharbeiter mit Berufsabschluss. Aber nur im Schnitt! Man kann nicht pauschal sagen:\nWer studiert, verdient automatisch gut. Es gibt Akademiker, die weniger bekommen als\nFachkräfte mit einer Berufsausbildung. Aber wenn man fragt, ob das Studium die richtige\nEntscheidung war, sagen die meisten: Ja, das würde ich wieder machen.\nEine letzte Frage: Muss man nach dem Abi unbedingt studieren?\nNein, es gibt genügend Alternativen. Wenn man sein Abitur in der Tasche aber keine Lust\nauf ein klassisches Studium hat, dann könnte beispielsweise eine Abiturientenausbildung\ndie richtige Wahl sein. Es handelt sich dabei um eine Mischung aus Theorie und Praxis in\neinem Betrieb. Diese Sonderausbildung für Abiturienten dauert zwischen zwei und vier\nJahren und bietet gute berufliche Perspektiven.\nVielen Dank, Herr Doktor Beckmann, für dieses aufschlussreiche Gespräch.\nGern geschehen.\n© Praxis\n- 19 -\nTeil 3\n- 20 -\n© Praxis\nModeratorin: Willkommen bei Altona Radio Hamburg, heute mit der Frage: Praktika gehören zu einer\nerfolgreichen Berufs- und Karriereplanung wie das Salz zur Suppe. Aber: Bringt es tatsächlich etwas oder schmückt es nur unseren Lebenslauf? Mein erster Gast im Studio ist\nMartin Schmidt. Er ist Abiturient und hat im Rahmen eines deutschlandweiten Projekts\ngerade eine Reihe von Praktika abgeschlossen.\nPraktikant:\nHallo. Ja, das waren vierundvierzig Kurzzeitpraktika innerhalb von fünf Monaten.\nModeratorin: Vierundvierzig! Da sind wir auf Ihre Erfahrungen gespannt. Außerdem begrüße ich im\nStudio Frau Bettina Krause. Sie hat sich mit 32 Jahren dazu entschlossen, beruflich neue\nWege zu gehen und absolviert im Moment ein Praktikum bei einer Werbeagentur.\nPraktikantin: Guten Tag.\nModeratorin: Herr Schmidt, Handwerksberufe sind ja nun nicht die erste Wahl bei Abiturienten. Warum\nhaben Sie sich entschieden, bei diesem Projekt mitzumachen?\nPraktikant:\nAlso, bei mir war es so, dass ich nach meinem Abi nicht wirklich wusste, in welche\nRichtung ich mal gehen möchte, aber ich hatte auch keine große Lust, direkt mit einem\nStudium anzufangen und wieder die ganze Zeit nur Theorie zu lernen. Und da kam die Gelegenheit ganz gut, in 44 verschiedene Berufe reinzugucken. Da gibt es echt viele Berufe,\ndie ganz anders waren, als ich mir vorgestellt hatte.\nModeratorin: „Reingucken“ beschreibt die Sache sehr gut. Reichen denn zwei Tage überhaupt aus, um\nden jeweiligen Handwerksberuf kennenzulernen?\nPraktikant:\nIch habe auf jeden Fall einen ersten Eindruck von der Arbeit bekommen, Ich glaube, um\nsich festzulegen, ob ein Beruf der richtige für einen ist, bräuchte man dann schon länger.\nAber man findet schnell heraus, wenn einem etwas nicht liegt.\nModeratorin: Auch Sie, Frau Krause, haben gemerkt, dass Ihr bisheriger Job als Büroangestellte einer\ngroßen Autofirma nicht der ideale für Sie war.\nPraktikantin: Nun ja, eigentlich haben mich meine Freunde darauf aufmerksam gemacht. Ich war jahrelang mit meinem Leben unzufrieden, ohne genau sagen zu können, weshalb. Irgendwann\nhabe ich eine Karriereberaterin aufgesucht und mit ihrer Hilfe habe ich herausgefunden,\nwelcher Beruf besser zu mir passt.\nModeratorin: Aha, und welcher ist das?\nPraktikantin: Ich habe mich zur Werbetexterin ausbilden lassen, das heißt, ich entwerfe kreative Texte\nfür Werbeplakate und Verkaufsaktionen. Jetzt kann ich vor allem meine kreative Seite zur\nGeltung bringen.\nModeratorin: Ich kann mir vorstellen, dass es nicht leicht für Sie war, einen Praktikumsplatz zu finden,\ndenn oft herrscht in den Firmen die Meinung, dass ältere Praktikanten Schwierigkeiten\nhaben, sich in ihre neue Rolle einzufügen oder gar schnell die Lust verlieren, der „Outsider“ im Team zu sein.\nPraktikantin: Tatsächlich war ich die einzige Praktikantin über 25 (lacht), aber ich habe mich mit den\njüngeren Praktikanten prima verstanden. Außerdem hatte ich die Gelegenheit, meine\neigenen Kenntnisse und Erfahrungen an das Team weiterzugeben und selbst von dem\nWissen der Anderen zu profitieren.\nModeratorin: Nach all den interessanten Einblicken, die Sie beide uns gegeben haben, bitte ich um\neinen abschließenden Tipp für alle, die sich fragen, ob ihnen ein Praktikum etwas bringt.\nPraktikant:\nNatürlich kann es immer passieren, dass die Erwartungen an das Praktikum nicht erfüllt\nwerden. Aber ich denke, auch daraus zieht man wertvolle Erfahrungen für die spätere\nBerufswahl. So kann man bei der zukünftigen Jobsuche unpassende Stellen ausschließen.\nPraktikantin: Und ich denke, wenn wir lernen, mit einem missglückten Praktikum umzugehen, dann ist\ndas auch ein Gewinn für uns.\nModeratorin: Frau Krause, Herr Schmidt, vielen Dank, dass Sie heute bei uns waren. Liebe Zuhörer, ich\nverabschiede mich von Ihnen bis nächste Woche um die gleiche Zeit.\nTeil 4\nSehr geehrte Damen und Herren, ich bin Jutta Thiel von der Uni Regensburg und begrüße Sie sehr herzlich\nzu meinem Vortrag „Jugendgewalt in Deutschland“.\nUm es vorwegzunehmen: Dass Jugendliche Grenzen übertreten, ist normal: Es gehört einfach zum\nErwachsenwerden dazu. Jugendliche werden viel häufiger in kriminelle Handlungen verwickelt als irgendeine andere Altersgruppe, insbesondere wenn Gewalt im Spiel ist. Dass die Täter immer jünger und immer\nbrutaler werden, ist jedoch ein Problem. Nicht nur für die Opfer, meist ebenfalls Jugendliche, sondern für\ndie gesamte Gesellschaft.\nWeil Jugendliche besonders sensibel auf Veränderungen reagieren, gilt Jugendgewalt als Indikator für gesellschaftliche Krisen: Sie kann als eine Art „Fieberkurve“ der Gesellschaft bewertet werden. Nehmen wir\nals Beispiel die Wiedervereinigung Deutschlands. In den Jahren danach stieg die Zahl krimineller Jugendlicher in Deutschland rasant an. Medien und Forschung suchten nach Erklärungen, die Öffentlichkeit war\nalarmiert. Jugendgewalt wurde zum ersten Mal als Problem genannt.\nMittlerweile sind die Zahlen gewalttätiger Jugendlicher stark zurückgegangen. Jedoch hat sich in der Vorgehensweise der Jugendlichen inzwischen einiges verändert. Viele Regeln, die früher für Prügeleien unter\nJugendlichen galten, gelten heute anscheinend nicht mehr: Die Schläger zielen bewusst auf den Kopf, und\nes ist längst nicht immer Schluss, wenn das Opfer am Boden liegt und aufgibt.\nAber warum werden Jugendliche überhaupt gewalttätig? Fest steht: Es ist nicht ein bestimmter Grund,\nsondern eine ganze Reihe von Ursachen, von Risikofaktoren, die zur jugendlichen Gewalt beitragen. Klar\nist auch: Eine biologische Störung ist selten der Grund, wenn ein Jugendlicher gewalttätig wird.\nEin Risikofaktor ist mit Sicherheit das Elternhaus. Konflikten mit Gewalt zu begegnen, ist eine Strategie,\ndie Kinder oft von ihren Eltern erlernen. Gewalt wird von Generation zu Generation weitergegeben. Auch\neine problematische Wohnsituation kann ein Risikofaktor sein. Mangelnde Sprachkenntnisse, brutale Filme oder Computerspiele, sozialer Neid und sogar Langeweile, all das kann eine negative Wirkung haben.\nDie Gewaltspitze liegt bei circa 16 bis 21 Jahren, danach geht die Gewalt zurück. Das Ende der Gewaltbereitschaft kommt meist von alleine. Aus den meisten Jugendlichen, die eine aggressive Phase durchlaufen,\nwerden später friedliche Erwachsene, die nie wieder auffällig werden.\nDennoch ist es nötig, so früh wie möglich Maßnahmen zu ergreifen, um solch eine unerwünschte Entwicklung zu vermeiden. Die Jugendlichen müssen unter anderem erkennen, dass es nicht nur körperliche\nGewalt gibt, sondern dass Gewalt schon viel früher anfängt. Auch Mobbing und Ausgrenzung sind eine\nForm der Gewalt.\nStudien haben außerdem gezeigt, dass Jugendliche, die besonders häufig als Täter in Erscheinung treten,\nauch häufiger Opfer von Gewalt sind. Viele Opfer wollen leider nicht über ihre Erlebnisse reden, aus Angst,\ndass ihnen noch mehr passiert, oder sie wollen schlicht nicht mehr an den Vorfall erinnert werden. Jedoch\nist in den letzten Jahren die Bereitschaft jugendlicher Opfer, Gewalttaten anderer Jugendlicher anzuzeigen, gestiegen.\nMeine Damen und Herren, ich danke Ihnen vielmals für Ihre Aufmerksamkeit.\n© Praxis\n- 21 -","S":"SCHREIBEN (Lehrbuch, OCR)\nAQ autpte\nn Forumsbeitrag über die Nutzung von sozialen Medien heute,\npipen eine!\nJie der sozialen Medien in der heutigen Geselischaft\npolle :\na ie Fanigy in der Vergangenheit\n+ Desi :\nYor: und Nachteile -\n+e arwixiung von soalalön Wedien ina zukian\n+ De\neine Einleitung und einen Schluss. Bei der Bewertun\nete bearbektt sind, wie Korrekt der Text ist und wie 9\ndur vetteipft sind Schrelben Sie mindestens 150 Werter.\nand\n'9 wird darauf geachtet, wie genau die\nut die Sötze und Abschnitte sprachlich\n\\ :\nAulgab
